<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Oswald:wght@700&display=swap" rel="stylesheet"/>
<title>Launch Housing — Workforce Skills Framework</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Segoe UI',Arial,sans-serif;background:#F7F6FB;color:#111;font-size:14px}
h1,h2,.role-header-card h2,.section-header,.landing-title,.hstat-num{font-family:'Oswald','DM Sans','Arial Narrow',Arial,sans-serif;font-weight:700;letter-spacing:-.3px}
button{font-family:inherit;cursor:pointer}
select,input{font-family:inherit}
.hidden{display:none!important}

/* Layout */
#app{min-height:100vh}
header{background:linear-gradient(135deg,#400D71 0%,#582C83 100%);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(88,44,131,.3)}
header h1{color:#fff;font-size:21px;font-weight:800;letter-spacing:-.3px}
header p{color:rgba(255,255,255,.65);font-size:13px;margin-top:3px}
.header-right{text-align:right}
.header-brand{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:6px}
.header-beta-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px}
.beta-chip{font-size:10px;font-weight:800;letter-spacing:.08em;color:#F58220;background:rgba(245,130,32,.15);border:1px solid rgba(245,130,32,.4);border-radius:4px;padding:2px 7px;line-height:1.4}
.feedback-btn{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 12px;text-decoration:none;letter-spacing:.01em;transition:background .15s,border-color .15s;white-space:nowrap}
.feedback-btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6)}
.header-stats{display:flex;gap:16px;justify-content:flex-end}
.stat-num{font-size:20px;font-weight:800;color:#fff;line-height:1;text-align:center}
.stat-lbl{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

.body-wrap{display:flex;min-height:calc(100vh - 70px)}
aside{width:272px;min-width:220px;background:#fff;border-right:1px solid #E0D8F0;padding:24px 18px;display:flex;flex-direction:column;gap:20px;flex-shrink:0}
main{flex:1;padding:24px 28px;overflow-y:auto;min-width:0}

/* Sidebar */
.sb-label{font-size:11px;font-weight:800;color:#582C83;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sb-hint{font-size:11px;color:#777;margin:0 0 7px;line-height:1.45}
.sb-divider{height:1px;background:#E0D8F0;flex-shrink:0}
select,input[type=text]{width:100%;padding:8px 10px;border:1px solid #E0D8F0;border-radius:7px;font-size:13px;background:#fff;color:#111;outline:none}
.clear-btn{margin-top:6px;font-size:12px;color:#D9382C;background:none;border:none;padding:0;font-weight:700}
.export-btn{width:100%;padding:9px 0;background:#582C83;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700}
.export-btn:disabled{background:#D0C8E0;cursor:not-allowed}
.mode-btns{display:flex;flex-direction:column;gap:4px}
.mode-btn{padding:8px 12px;font-size:13px;font-weight:700;border-radius:7px;border:1px solid #E0D8F0;background:#fff;color:#444;text-align:left;transition:all .12s}
.mode-btn.active{border:2px solid #582C83;background:#F7F4FC;color:#582C83}
.search-wrap{position:relative}
.search-wrap input{padding-right:28px}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:#777;line-height:1;padding:0}
.spacer{flex:1}

/* Pills & chips */
.pill{display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-purple{background:#582C83;color:#fff}
.pill-green{background:#86C555;color:#fff}
.pill-orange{background:#F58220;color:#fff}
.pill-blue{background:#44C7F4;color:#fff}
.pill-grey{background:#EBEBEB;color:#777}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#EDE8F5;border-radius:8px;font-size:12px;margin-bottom:16px}
.filter-chip{background:#fff;border:1px solid #582C83;color:#582C83;border-radius:4px;padding:2px 8px;display:flex;align-items:center;gap:5px}
.chip-x{background:none;border:none;color:#D9382C;font-weight:700;font-size:14px;line-height:1;padding:0;cursor:pointer}
.filter-count{color:#777;margin-left:2px}
.clear-all{margin-left:auto;background:none;border:none;color:#D9382C;font-size:12px;font-weight:700;padding:2px 0;cursor:pointer}

/* Empty states */
.empty{text-align:center;margin-top:64px;color:#777}
.empty .icon{font-size:40px;margin-bottom:14px}
.empty .title{font-size:15px;font-weight:700;color:#444}
.empty .sub{font-size:13px;margin-top:8px}

/* Role header */
.role-header{margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #EDE8F5}
.role-header h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.role-header .band{margin-top:8px}

/* Stats row */
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-tile{background:#fff;border:1px solid #E0D8F0;border-radius:8px;padding:10px 18px;text-align:center;min-width:80px}
.stat-tile .val{font-size:24px;font-weight:800;color:#582C83;line-height:1}
.stat-tile .lbl{font-size:12px;color:#777;margin-top:4px}

/* Accordion blocks */
.family-block{margin-bottom:14px;border:1px solid #E0D8F0;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(88,44,131,.06)}
.family-header{padding:13px 16px;background:linear-gradient(90deg,#EEE5FA 0%,#F7F4FC 100%);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.family-header:hover{background:linear-gradient(90deg,#E5D8F7 0%,#F0ECF9 100%)}
.family-title{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:800;color:#582C83;letter-spacing:-.2px}
.family-count{font-size:12px;color:#777}
.skill-block{border-top:1px solid #E0D8F0}
.skill-header{padding:9px 16px 9px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;background:#FDFCFF}
.skill-header:hover{background:#F5F2FA}
.skill-title{font-size:13px;font-weight:700;color:#444;display:flex;align-items:center}
.skill-count{font-size:11px;color:#777}
.indicator-list{list-style:none;padding:4px 16px 12px 32px}
.indicator-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;margin-bottom:6px;border-radius:6px;font-size:13px;line-height:1.55;background:#fff;border:1px solid #E0D8F0}
.indicator-item.shared{background:#F0FAE6;border-color:#C3E8A0}
.indicator-item.unique1{background:#FFF4EC;border-color:#FAD4A8}
.indicator-item.unique2{background:#EAF8FD;border-color:#A8E5F5}
.indicator-item.missing{background:#FAFAFA;border:1px dashed #E0D8F0;color:#777}
.indicator-text{flex:1}

/* Chevron */
.chev{display:inline-block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid #582C83;transition:transform .15s;margin-right:8px;flex-shrink:0;margin-top:1px}
.chev.open{transform:rotate(90deg)}

/* Compare grid */
.compare-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;position:sticky;top:0;z-index:10}
.role-col-header{border-radius:8px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.role-col-header.r1{background:#582C83}
.role-col-header.r2{background:#400D71}
.role-col-label{font-size:10px;opacity:.65;font-weight:800;letter-spacing:.06em;margin-bottom:2px;text-transform:uppercase}
.role-col-name{font-size:14px;font-weight:700}
.compare-summary{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;padding:14px 18px;background:#fff;border:1px solid #E0D8F0;border-radius:10px}
.compare-legend{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap;font-size:12px;color:#444;align-items:center}
.legend-dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px}
.compare-skill-grid{display:grid;grid-template-columns:1fr 1fr}
.compare-col1{padding:8px 12px 8px 28px;border-right:1px solid #E0D8F0}
.compare-col2{padding:8px 12px 8px 16px}
.skill-row-header{padding:9px 16px 9px 28px;background:#FDFCFF;font-size:13px;font-weight:700;color:#444;border-bottom:1px solid #E0D8F0;display:flex;align-items:center;gap:8px}

/* Gap analysis */
.gap-summary-bar{padding:18px 20px;margin-bottom:24px;background:linear-gradient(135deg,#400D71 0%,#582C83 100%);border-radius:12px;color:#fff;box-shadow:0 2px 12px rgba(88,44,131,.25)}
.gap-roles-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gap-role-box{border-radius:7px;padding:6px 12px}
.gap-role-box.current{background:rgba(255,255,255,.12)}
.gap-role-box.target{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.gap-role-label{font-size:10px;opacity:.7;font-weight:700;letter-spacing:.08em;margin-bottom:2px;text-transform:uppercase}
.gap-role-name{font-weight:700;font-size:14px}
.gap-role-band{font-size:11px;opacity:.7;margin-top:2px}
.gap-arrow{font-size:22px;opacity:.6}
.gap-summary-text{font-size:13px;line-height:1.6;opacity:.92}
.gap-stat-pills{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.gap-stat-pill{border-radius:7px;padding:8px 14px;text-align:center;min-width:70px}
.gap-stat-num{font-size:22px;font-weight:800;line-height:1}
.gap-stat-lbl{font-size:11px;opacity:.8;margin-top:3px;color:#fff}
.gap-section{margin-bottom:28px}
.gap-section-header{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;margin-bottom:12px;border-radius:10px;border-width:1px;border-style:solid}
.gap-section-icon{font-size:22px;line-height:1.2}
.gap-section-title{font-size:16px;font-weight:800}
.gap-section-sub{font-size:13px;color:#444;margin-top:4px;line-height:1.5}
.gap-section-empty{margin-bottom:24px;padding:14px 18px;background:#FAFAFA;border:1px dashed #E0D8F0;border-radius:10px}
.gap-family-block{margin-bottom:10px;border:1px solid #E0D8F0;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(88,44,131,.05)}
.gap-family-header{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.gap-family-header:hover{opacity:.9}
.gap-family-title{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:800}
.gap-skill-block{border-top:1px solid #E0D8F0}
.gap-skill-header{padding:9px 16px 9px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;background:#FDFCFF}
.gap-skill-header:hover{background:#F5F2FA}
.gap-indicator-list{list-style:none;padding:4px 16px 12px 32px}
.gap-indicator{margin-bottom:8px}
.gap-ind-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;line-height:1.55;border-width:1px;border-style:solid}
.gap-ind-row.have{background:#F0FAE6;border-color:#C3E8A0}
.gap-ind-row.develop{background:#EDE8F5;border-color:#D4C8EE}
.gap-ind-row.strengthen{background:#FFF4EC;border-color:#FAD4A8}
.gap-ind-icon{font-size:14px;font-weight:900;flex-shrink:0;margin-top:1px}
.icon-have{color:#86C555}
.icon-develop{color:#582C83}
.icon-strengthen{color:#F58220}

/* How to develop — moved to drawer */
.dev-sub{border-radius:6px;overflow:hidden;border:1px solid #E0D8F0;margin-bottom:6px}
.dev-sub-header{width:100%;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#FDFCFF;border:none;text-align:left;cursor:pointer}
.dev-sub-header:hover{background:#F5F2FA}
.dev-sub-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;flex:1}
.dev-sub-body{padding:6px 12px 10px 12px;background:#fff}
.dev-bullet{display:flex;gap:7px;font-size:12px;color:#444;line-height:1.5;margin-bottom:4px}
.dev-bullet-dot{font-weight:900;flex-shrink:0;margin-top:1px}
.coaching-q{display:flex;gap:7px;font-size:12px;color:#444;line-height:1.5;margin-bottom:5px}
.coaching-num{font-weight:900;color:#582C83;flex-shrink:0;margin-top:1px}

/* Position mapping */
.pos-panel{background:#F0EAF9;border:1px solid #D4C8EE;border-radius:10px;padding:14px 16px;margin-bottom:20px}
.pos-panel-title{font-size:12px;font-weight:800;color:#582C83;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.pos-table{width:100%;border-collapse:collapse;font-size:12px}
.pos-table th{text-align:left;padding:5px 8px;color:#582C83;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #D4C8EE;white-space:nowrap}
.pos-table td{padding:5px 8px;color:#333;border-bottom:1px solid #EDE8F5;vertical-align:top;white-space:nowrap}
.pos-table td:first-child{white-space:normal}
.pos-table tr:last-child td{border-bottom:none}
.pos-table tr:hover td{background:rgba(88,44,131,.04)}
.pos-insight{font-size:12px;color:#582C83;font-weight:600;margin-bottom:8px}
.pos-view-card{background:#fff;border:1px solid #E0D8F0;border-radius:10px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(88,44,131,.06)}
.pos-view-field{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;margin-bottom:6px;font-size:13px}
.pos-view-label{font-weight:700;color:#582C83;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px;white-space:nowrap}
.pos-view-val{color:#111;word-break:normal;overflow-wrap:anywhere}
.gap-context-note{background:#EDE8F5;border:1px solid #D4C8EE;border-radius:8px;padding:10px 14px;font-size:12px;color:#444;margin-bottom:16px;line-height:1.5}
.gap-context-note strong{color:#582C83}
.pos-toggle{font-size:11px;color:#582C83;font-weight:700;background:none;border:none;padding:0;cursor:pointer;margin-top:6px;display:flex;align-items:center;gap:4px}
.pos-profile{background:#fff;border:1px solid #E0D8F0;border-radius:10px;box-shadow:0 1px 4px rgba(88,44,131,.06);margin-bottom:20px;overflow:hidden}
.pos-profile-header{background:linear-gradient(90deg,#EEE5FA 0%,#F7F4FC 100%);padding:14px 18px;border-bottom:1px solid #E0D8F0}
.pos-profile-grid{display:grid;grid-template-columns:130px 140px 1fr 1fr;gap:0;padding:0}
.pos-profile-field{padding:10px 16px;border-right:1px solid #F0EAF9;border-bottom:1px solid #F0EAF9;min-width:0;overflow:hidden}
.pos-profile-field:last-child{border-right:none}
.pos-profile-field .pos-view-val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-other-section{margin-top:24px;padding-top:16px;border-top:2px solid #EDE8F5}
.pos-other-title{font-size:13px;font-weight:800;color:#582C83;margin-bottom:4px}
.pos-other-sub{font-size:12px;color:#777;margin-bottom:12px}
.pos-other-table{width:100%;border-collapse:collapse;font-size:12px}
.pos-other-table th{text-align:left;padding:6px 10px;color:#582C83;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #EDE8F5;background:#FDFCFF;white-space:nowrap}
.pos-other-table td{padding:6px 10px;color:#333;border-bottom:1px solid #F0EAF9;vertical-align:top;white-space:nowrap}
.pos-other-table td:first-child{white-space:normal}
.pos-other-table tr:last-child td{border-bottom:none}
.pos-other-table tr:hover td{background:rgba(88,44,131,.03)}
.pv-family-block{margin-bottom:14px;border:1px solid #E0D8F0;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(88,44,131,.06)}
.pv-family-header{padding:13px 16px;background:linear-gradient(90deg,#EEE5FA 0%,#F7F4FC 100%);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.pv-family-header:hover{background:linear-gradient(90deg,#E5D8F7 0%,#F0ECF9 100%)}
.pv-skill-block{padding:12px 16px 4px 20px;border-top:1px solid #EDE8F5}
.pv-skill-block:first-child{border-top:none}
.pv-skill-name{font-size:13px;font-weight:700;color:#444;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pv-skill-name::before{content:'';display:inline-block;width:3px;height:13px;background:#582C83;border-radius:2px;flex-shrink:0}
.pv-indicator{font-size:13px;color:#555;line-height:1.55;padding:4px 0 4px 18px;border-left:2px solid #EDE8F5;margin:3px 0 3px 6px}
.pv-indicator:last-child{margin-bottom:8px}

/* Role Profile card */
.rp-card{background:#fff;border:1px solid #E0D8F0;border-radius:10px;padding:16px 20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(88,44,131,.06)}
.rp-meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;align-items:center}
.rp-meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#555}
.rp-meta-label{font-weight:700;color:#582C83;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.rp-badge{display:inline-block;border-radius:4px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.rp-badge-self{background:#EDE8F5;color:#582C83}
.rp-badge-others{background:#E0F3FF;color:#1A6A9A}
.rp-badge-leaders{background:#FFF0E0;color:#954D00}
.rp-profile-text{font-size:13px;color:#333;line-height:1.65;margin:0}

/* Compare Roles — Capability Overview matrix */
.ov-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:0;table-layout:fixed}
.ov-table th{text-align:left;padding:7px 10px;font-size:11px;font-weight:800;color:#582C83;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #EDE8F5;background:#FDFCFF;white-space:nowrap;overflow:hidden}
.ov-table th:first-child{width:50%}
.ov-table th.ov-role-col{text-align:center;width:25%}
.ov-table td{padding:6px 10px;border-bottom:1px solid #F0EAF9;vertical-align:top;word-break:normal;overflow-wrap:anywhere}
.ov-table td.ov-skill{font-size:13px;color:#333;padding-left:20px;vertical-align:middle}
.ov-table td.ov-check{text-align:center;vertical-align:middle}
.ov-family-row td{background:linear-gradient(90deg,#EEE5FA 0%,#F7F4FC 100%);font-weight:800;color:#582C83;font-size:13px;padding:8px 10px}
.ov-check-yes{font-size:15px;color:#86C555;font-weight:900}
.ov-check-no{font-size:15px;color:#E0D0EE;font-weight:400}
.ov-skill-shared{color:#333}
.ov-skill-only1{color:#E07010;font-style:italic}
.ov-skill-only2{color:#1490B8;font-style:italic}


/* Compare: improved status badges + expandable skill rows */
.ov-badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.ov-badge-shared{background:#EAF6DC;color:#3A7A1A}
.ov-badge-only1{background:#FEF0E2;color:#C05A00}
.ov-badge-only2{background:#E3F4FD;color:#0A6A96}
.ov-skill-row{cursor:pointer;user-select:none}
.ov-skill-row:hover td{background:rgba(88,44,131,.03)}
.ov-expand-icon{font-size:9px;color:#999;transition:transform .15s;display:inline-block;margin-left:4px}
.ov-expand-icon.open{transform:rotate(90deg)}
.ov-ind-panel{display:none}
.ov-ind-panel.open{display:table-row-group}
.ov-ind-row{background:#FAFAFA}
.ov-ind-row td{padding:6px 10px;font-size:12px;color:#444;border-bottom:1px solid #F5F0FB;vertical-align:top;word-break:normal;overflow-wrap:anywhere}
.ov-ind-r1{border-left:3px solid #F58220;background:#FFF8F2}
.ov-ind-r2{border-left:3px solid #44C7F4;background:#F2FBFF}
.ov-ind-shared{border-left:3px solid #86C555;background:#F5FCF0}
.ov-ind-empty{background:#FAFAFA}
.ov-expand-all-bar{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid #E0D8F0;background:#FDFCFF}
.ov-expand-btn{background:none;border:1px solid #D4C8EE;border-radius:5px;padding:4px 10px;font-size:11px;font-weight:700;color:#582C83;cursor:pointer}
.ov-expand-btn:hover{background:#EDE8F5}

/* Development Goal Builder */

const SKILL_DEV = {"SF0101": {"experience": ["Take the lead on an assessment for a new client, then debrief with your supervisor on your analysis and decision-making.", "Apply a consistent assessment framework across your next three client contacts and review patterns in the needs you identify."], "exposure": ["Observe a more experienced worker conduct a complex assessment — note how they structure questions and respond to what they hear.", "Request to sit in on an assessment being conducted by a colleague from a different program area to broaden your practice."], "education": ["Undertake self-directed learning on strengths-based or trauma-informed assessment approaches relevant to your client group.", "Bring a current case to supervision and use the session to map your assessment against the framework indicators."], "coaching": ["What has your experience of conducting assessments been like so far — where do you feel most confident?", "Tell me about a time when an assessment led to a clear action. What made the difference?", "What aspects of assessment practice would you like to strengthen, and what support would help?"]}, "SF0102": {"experience": ["Take primary responsibility for completing a risk assessment on an active case and document your analysis and recommended responses.", "Lead the development of a safety plan with an individual, incorporating their input and identifying clear escalation steps."], "exposure": ["Observe a senior worker conduct a safety planning conversation — note how they discuss risk without escalating distress.", "Attend a debrief or critical incident review to understand how risk is analysed and responded to at a team level."], "education": ["Complete relevant training on risk frameworks, safety planning models, or trauma-informed risk practice.", "Use supervision to review a current case where risk is a factor — discuss your reasoning and any uncertainties."], "coaching": ["How do you currently approach a situation where you identify risk — what steps do you take?", "Where do you feel confident in your risk assessment practice, and where do you find it more challenging?", "What would help you feel more equipped to manage complex or high-risk situations?"]}, "SF0103": {"experience": ["Draft a case plan for an individual on your caseload and present it to your supervisor, including your rationale for each goal.", "Take responsibility for reviewing and updating a plan with an individual — document progress and any changes to goals or strategies."], "exposure": ["Attend a case review meeting for a more complex case managed by a senior colleague and observe how they adapt plans over time.", "Ask to co-facilitate a case planning conversation with a more experienced worker to observe how they engage the individual."], "education": ["Focus a supervision session on case planning practice — bring a current case and work through the plan structure together.", "Read or review guidance on strengths-based, trauma-informed, or person-centred planning approaches."], "coaching": ["How do you approach building a case plan with someone — what does that process look like for you?", "Think about a case where the plan worked well. What contributed to that? What would you do differently in a case that stalled?", "Where do you find case planning most challenging, and what support would help you develop further?"]}, "SF0104": {"experience": ["Complete case notes immediately after your next five client contacts, focusing on clarity, relevance, and compliance with recording standards.", "Review your own recent case notes and identify areas where the documentation could better reflect your decision-making."], "exposure": ["Request to review de-identified case notes from an experienced worker and compare how they structure entries to your own.", "Ask your supervisor to walk you through what high-quality documentation looks like in a complex or high-risk case."], "education": ["Ask your supervisor to audit two or three recent case notes and provide specific feedback on quality and compliance.", "Familiarise yourself with the relevant privacy legislation and organisational policies that guide case recording."], "coaching": ["How do you currently decide what to include in a case note — what is your reasoning process?", "Have you ever had feedback on your documentation? What did you learn from it?", "What do you find most challenging about maintaining timely, accurate records, and what would help?"]}, "SF0105": {"experience": ["Take responsibility for coordinating a referral end-to-end — from identification through to confirmed handover and follow-up.", "Facilitate or co-facilitate a case coordination meeting, taking responsibility for the agenda, notes, and agreed actions."], "exposure": ["Attend a multi-disciplinary team meeting with a more experienced worker and observe how they manage different perspectives.", "Shadow a colleague during a complex coordination task involving multiple services and ask them to explain their decision-making."], "education": ["Use a supervision session to map the coordination pathways for a current case — identify who is involved and how handovers are managed.", "Build your knowledge of local service systems by attending an interagency forum or networking with external service providers."], "coaching": ["What opportunities have you had to coordinate across services — how did that go?", "Think about a time when a referral or handover didn't go smoothly. What did you learn from that?", "What support or information would help you feel more confident coordinating complex cases?"]}, "SF0106": {"experience": ["Co-develop a transition or exit plan with an individual approaching the end of their service, with supervisor support.", "Lead a planned exit conversation with an individual — document the agreed plan and any follow-up actions."], "exposure": ["Observe a senior worker facilitate a transition planning conversation and note how they address concerns about housing security.", "Attend a handover meeting between your service and a receiving service to understand what a warm transfer looks like in practice."], "education": ["Discuss transition and exit planning in supervision — focus on a current case where an exit is being considered or planned.", "Explore best practice in housing transition support, including how to sustain outcomes after service exit."], "coaching": ["What has your experience of transition or exit planning been so far — what went well?", "How do you approach a situation where an individual is anxious or resistant about leaving the service?", "What would strengthen your ability to support individuals through planned or unplanned exits?"]}, "SF0201": {"experience": ["Process a batch of invoices or financial transactions and self-check your work against approval guidelines before submitting.", "Take responsibility for identifying and resolving a discrepancy in financial records, documenting the steps you took."], "exposure": ["Sit with a more experienced team member during end-of-month reconciliation and observe how discrepancies are identified and resolved.", "Ask your manager to walk you through the approval workflow for a transaction you are unfamiliar with."], "education": ["Review the organisational procedures for financial processing and identify any steps you have not yet applied independently.", "Ask your manager to explain the compliance requirements for your role and how they relate to your day-to-day tasks."], "coaching": ["What aspects of financial processing and governance do you feel confident with, and where are you less certain?", "Tell me about a time when you identified a discrepancy or error. How did you handle it?", "What would help you feel more confident applying compliance procedures in your daily work?"]}, "SF0202": {"experience": ["Design and distribute a short feedback mechanism after a program activity and present a summary of responses to your team.", "Identify one change you have made to your practice based on client or participant feedback — document the outcome."], "exposure": ["Attend a program review or debrief meeting and observe how feedback is discussed and used to inform planning.", "Ask a colleague how they gather informal feedback during day-to-day interactions and incorporate it into their work."], "education": ["Use a supervision session to discuss how feedback is currently collected in your program — identify one gap and propose an improvement.", "Explore basic principles of participatory practice or co-design to broaden your approach to feedback and engagement."], "coaching": ["How do you currently gather feedback from the people you work with — what methods do you use?", "Give me an example of a time when feedback changed how you did something. What was the impact?", "What would help you build a more consistent approach to seeking and using feedback in your work?"]}, "SF0301": {"experience": ["Take responsibility for a full stock audit — count, reconcile, and flag any shortfalls or ordering needs.", "Manage the distribution of supplies during a high-demand period, prioritising based on individual needs."], "exposure": ["Work alongside a more experienced colleague during a busy intake or distribution period to observe how they prioritise and manage supply.", "Ask your team leader to walk you through the ordering and stock management process from end to end."], "education": ["Review your organisation's inventory management procedures and identify any steps you have not yet been responsible for.", "Reflect in supervision on how effective supply management supports service delivery and client outcomes."], "coaching": ["How do you currently manage and prioritise supply and distribution tasks — what guides your decisions?", "Tell me about a time when stock or supply management went well. What contributed to that?", "What would help you manage inventory and distribution more effectively in your role?"]}, "SF0302": {"experience": ["Manage the reception or concierge function independently for a full shift, including responding to all enquiries and access needs.", "Take the lead on a challenging client interaction at reception and debrief with your supervisor on how you managed it."], "exposure": ["Observe a more experienced worker respond to a distressed or complex client at reception and note the strategies they use.", "Shadow a colleague during a high-traffic period to see how they balance competing demands while maintaining a welcoming environment."], "education": ["Use supervision to debrief after a difficult client interaction — discuss what worked, what you would do differently, and any support needed.", "Build your knowledge of trauma-informed or strengths-based engagement approaches relevant to frontline service environments."], "coaching": ["What do you find most rewarding about your frontline role, and what do you find most challenging?", "How do you manage your own wellbeing when you are dealing with distressing or complex client situations?", "What skills or knowledge would help you feel more confident in your customer engagement responsibilities?"]}, "SF0402": {"experience": ["Design and facilitate a session or activity from scratch — develop the plan, deliver it, and gather participant feedback.", "Lead a regular group activity or program component, taking responsibility for planning, delivery, and review."], "exposure": ["Attend a workshop or group program facilitated by a more experienced colleague and observe how they manage content, group dynamics, and unexpected moments.", "Participate in a debrief after a program activity with your supervisor or a peer — discuss what was effective and what could be strengthened."], "education": ["Ask a more experienced facilitator to review your program plan and provide feedback before you deliver it.", "Explore facilitation frameworks or group work practice principles relevant to your client group."], "coaching": ["What opportunities have y function unique(arr) { return [...new Set(arr)]; }
function esc(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function h(tag, attrs, ...children) {
  const attrStr = Object.entries(attrs||{}).map(([k,v])=>`${k}="${esc(v)}"`).join(" ");
  const inner = children.flat().join("");
  return `<${tag}${attrStr?" "+attrStr:""}>${inner}</${tag}>`;
}

function filterRecords(role, search, familyFilter) {
  let recs = MOCK_DATA.filter(r=>r.role===role);
  if (search) {
    const q = search.toLowerCase();
    recs = recs.filter(r=>
      r.indicator.toLowerCase().includes(q) ||
      r.skill.toLowerCase().includes(q) ||
      r.skill_family.toLowerCase().includes(q)
    );
  }
  if (familyFilter) recs = recs.filter(r=>r.skill_family===familyFilter);
  return recs;
}

function groupBy(records) {
  const out = {};
  records.forEach(r=>{
    if (!out[r.skill_family]) out[r.skill_family]={};
    if (!out[r.skill_family][r.skill]) out[r.skill_family][r.skill]=[];
    out[r.skill_family][r.skill].push(r.indicator);
  });
  return out;
}

function groupByGap(records) {
  const out = {};
  records.forEach(r=>{
    if (!out[r.skill_family]) out[r.skill_family]={};
    if (!out[r.skill_family][r.skill]) out[r.skill_family][r.skill]=[];
    out[r.skill_family][r.skill].push({indicator:r.indicator,skill_code:r.skill_code});
  });
  return out;
}

function exportCSV(records) {
  var headers = ["role","band","skill_code","skill_family","skill","indicator"];
  var rows = records.map(function(r){
    return headers.map(function(h){ var v=(h==="portfolio"?displayPortfolio(r[h]):r[h])||""; return '"'+v.split('"').join('""')+'"'; }).join(",");
  });
  var csv = headers.join(",") + "\n" + rows.join("\n");
  var blob = new Blob([csv], {type:"text/csv"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href=url; a.download="skills-export.csv"; a.click();
  URL.revokeObjectURL(url);
}

// ── GAP ANALYSIS ──────────────────────────────────────────────────────────────
const STOPWORDS = new Set("a an the and or of to in for with on at by from is are be been that this their its as into across within between through about up it not but so if all each both more other than then them they these those which where who".split(" "));
function tokenise(s){ return s.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOPWORDS.has(w)); }
function overlap(t,s){ const tw=new Set(tokenise(t)),sw=new Set(tokenise(s)); if(!tw.size)return 0; let m=0; tw.forEach(w=>{if(sw.has(w))m++;}); return m/tw.size; }

function computeGap(currentRecs, targetRecs) {
  const byCode={}, codes=new Set(), names=new Set();
  currentRecs.forEach(r=>{ codes.add(r.skill_code); names.add(r.skill); if(!byCode[r.skill_code])byCode[r.skill_code]=[]; byCode[r.skill_code].push(r.indicator); });
  const have=[], develop=[], strengthen=[];
  targetRecs.forEach(r=>{
    const shared = codes.has(r.skill_code)||names.has(r.skill);
    if (!shared) { develop.push(r); return; }
    const pool = [...(byCode[r.skill_code]||[]), ...currentRecs.filter(c=>c.skill===r.skill).map(c=>c.indicator)];
    const isHave = pool.some(ci=>ci===r.indicator||overlap(r.indicator,ci)>=0.6);
    if (isHave) have.push(r); else strengthen.push(r);
  });
  return {have, develop, strengthen};
}

  if (search) chips.push(`<span class="filter-chip">Search: &ldquo;${esc(search)}&rdquo;<button class="chip-x" onclick="clearSearch()">×</button></span>`);
  if (familyFilter) chips.push(`<span class="filter-chip">Family: ${esc(familyFilter)}<button class="chip-x" onclick="clearFamily()">×</button></span>`);
  return `<div class="active-filters" id="filter-bar-chips"><span style="color:#582C83;font-weight:800">Active filters:</span>${chips.join("")}<span class="filter-count">${count} result${count!==1?"s":""}</span><button class="clear-all" onclick="clearAllFilters()">Clear all</button></div>`;
}

function renderFilterChips() {
  const {search, familyFilter, selectedRole, mode} = state;
  if (mode!=="single"||!selectedRole||((!search)&&(!familyFilter))) return "";
  const chips = [];
  if (search) chips.push(`<span class="filter-chip">Search: &ldquo;${esc(search)}&rdquo;<button class="chip-x" onclick="clearSearch()">×</button></span>`);
  if (familyFilter) chips.push(`<span class="filter-chip">Family: ${esc(familyFilter)}<button class="chip-x" onclick="clearFamily()">×</button></span>`);
  const recs = filterRecords(state.selectedRole, search, familyFilter);
  return `<span style="color:#582C83;font-weight:800">Active filters:</span>${chips.join("")}<span class="filter-count">${recs.length} result${recs.length!==1?"s":""}</span><button class="clear-all" onclick="clearAllFilters()">Clear all</button>`;
}

function renderComparePanel() {
  try {
    var r1 = state.compareRole1, r2 = state.compareRole2;
    var search = state.search, familyFilter = state.familyFilter;

    if (!r1||!r2) return '<div class="empty"><div class="icon">&#9878;&#65039;</div><div class="title">Select two roles to compare</div><div class="sub">Use the Role 1 and Role 2 dropdowns in the left panel.</div></div>';
    if (r1===r2) return '<div class="empty"><div class="sub">Please select two different roles to compare.</div></div>';

    // Use unfiltered data for the overview matrix, filtered for detail view
    var allRecs1 = filterRecords(r1,"","");
    var allRecs2 = filterRecords(r2,"","");
    if (!allRecs1.length&&!allRecs2.length) return '<div class="empty"><div class="sub">Unable to display comparison results — no framework data found for the selected roles.</div></div>';

    var recs1 = filterRecords(r1,search,familyFilter);
    var recs2 = filterRecords(r2,search,familyFilter);

    var ag1 = groupBy(allRecs1), ag2 = groupBy(allRecs2);
    var g1  = groupBy(recs1),  g2  = groupBy(recs2);
    var i1 = new Set(recs1.map(function(r){return r.indicator;}));
    var i2 = new Set(recs2.map(function(r){return r.indicator;}));
    var allFamilies = unique([].concat(Object.keys(ag1),Object.keys(ag2)));
    var b1 = (MOCK_DATA.find(function(r){return r.role===r1;})||{}).band||"";
    var b2 = (MOCK_DATA.find(function(r){return r.role===r2;})||{}).band||"";
    var p1 = getProfile(r1), p2 = getProfile(r2);

    // Skill-level sets (all recs, unfiltered) for overview
    var skills1 = new Set(allRecs1.map(function(r){return r.skill;}));
    var skills2 = new Set(allRecs2.map(function(r){return r.skill;}));
    var sharedSkills  = [...skills1].filter(function(s){return skills2.has(s);}).length;
    var onlySkills1   = [...skills1].filter(function(s){return !skills2.has(s);}).length;
    var onlySkills2   = [...skills2].filter(function(s){return !skills1.has(s);}).length;

    // ── Summary bar ──────────────────────────────────────────────────────────
    var summaryBar =
      '<div class="compare-summary">'
      +'<div style="flex:1;min-width:180px">'
        +'<div style="font-size:11px;color:#777;margin-bottom:4px">Comparing</div>'
        +'<div style="font-weight:800;font-size:15px">'
          +esc(r1)+' <span style="margin-left:4px">'+pill(b1,"pill-purple")+'</span>'
          +' <span style="color:#aaa;font-weight:400;font-size:13px;margin:0 4px">vs</span> '
          +esc(r2)+' <span style="margin-left:4px">'+pill(b2,"pill-purple")+'</span>'
        +'</div>'
        +(p1||p2
          ? '<div style="margin-top:6px;font-size:12px;color:#777;display:flex;gap:16px;flex-wrap:wrap">'
              +(p1?'<span><strong>Role 1:</strong> '+esc(p1.role_category)+'</span>':'')
              +(p2?'<span><strong>Role 2:</strong> '+esc(p2.role_category)+'</span>':'')
              +(p1?'<span><strong>Leadership:</strong> '+esc(p1.leadership_level)+(p2&&p1.leadership_level!==p2.leadership_level?' → '+esc(p2.leadership_level):'')+'</span>':'')+'<span style="color:#DDD">|</span>'+'<span><strong>Role 1 positions:</strong> '+positionsForRole(r1).length+'</span>'+'<span><strong>Role 2 positions:</strong> '+positionsForRole(r2).length+'</span>'
            +'</div>'
          : '')
      +'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'
        +pill("&#10003; "+sharedSkills+" shared skill"+(sharedSkills!==1?"s":""),"pill-green")
        +pill(onlySkills1+" only in Role 1","pill-orange")
        +pill(onlySkills2+" only in Role 2","pill-blue")
      +'</div>'
      +'</div>';

    // ── Capability Overview matrix ────────────────────────────────────────────
    // Each skill row is expandable to show indicators inline.
    // All indicator sets are pre-built so toggling is instant (no re-render).
    var ovRows = allFamilies.map(function(fn, fi) {
      var fs1 = ag1[fn]||{}, fs2 = ag2[fn]||{};
      var famSkills = unique([].concat(Object.keys(fs1),Object.keys(fs2)));

      var skillRows = famSkills.map(function(sn, si) {
        var in1 = !!(fs1[sn]&&fs1[sn].length);
        var in2 = !!(fs2[sn]&&fs2[sn].length);
        var both = in1&&in2;
        var rowId = "ov-"+fi+"-"+si;
        var panelId = rowId+"-inds";
        var chevId  = rowId+"-chev";

        // Status badge
        var badge = both
          ? '<span class="ov-badge ov-badge-shared">&#10003; Both roles</span>'
          : in1
            ? '<span class="ov-badge ov-badge-only1">&#9679; Role 1 only</span>'
            : '<span class="ov-badge ov-badge-only2">&#9679; Role 2 only</span>';

        // Role-presence check cells (keep columns aligned but simplified)
        var c1 = in1 ? '<span style="color:#86C555;font-size:14px;font-weight:900">&#10003;</span>'
                     : '<span style="color:#DDD;font-size:13px">&mdash;</span>';
        var c2 = in2 ? '<span style="color:#86C555;font-size:14px;font-weight:900">&#10003;</span>'
                     : '<span style="color:#DDD;font-size:13px">&mdash;</span>';

        // Inline indicator panel — 3 cells to match table columns:
        // col1 = empty (aligns under Skill), col2 = Role1 indicator, col3 = Role2 indicator
        var inds1 = (fs1[sn]||[]);
        var inds2 = (fs2[sn]||[]);
        var maxRows = Math.max(inds1.length, inds2.length);
        var indRows = "";
        for (var k=0; k<maxRows; k++) {
          var v1 = inds1[k]||"";
          var v2 = inds2[k]||"";
          var cls1 = v1 ? (i2&&i2.has&&i2.has(v1) ? "ov-ind-shared" : "ov-ind-r1") : "ov-ind-empty";
          var cls2 = v2 ? (i1&&i1.has&&i1.has(v2) ? "ov-ind-shared" : "ov-ind-r2") : "ov-ind-empty";
          indRows += '<tr class="ov-ind-row">'
            +'<td style="background:#FAFAFA;border-bottom:1px solid #F0EAF9"></td>'
            +'<td class="'+cls1+'">'+(v1?esc(v1):'')+'</td>'
            +'<td class="'+cls2+'">'+(v2?esc(v2):'')+'</td>'
            +'</tr>';
        }
        var indPanel = maxRows>0
          ? '<tbody id="'+panelId+'" class="ov-ind-panel">'
              +'<tr style="background:#F7F4FC">'
                +'<td style="background:#F7F4FC;border-bottom:1px solid #EDE8F5"></td>'
                +'<td style="padding:5px 10px;font-size:11px;font-weight:700;color:#C05A00;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #EDE8F5">&#9632; Role 1</td>'
                +'<td style="padding:5px 10px;font-size:11px;font-weight:700;color:#0A6A96;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #EDE8F5">&#9632; Role 2</td>'
              +'</tr>'
              +indRows
            +'</tbody>'
          : '';

        return '<tr class="ov-skill-row" onclick="ovToggleSkill(\''+panelId+'\',\''+chevId+'\')">'
          +'<td class="ov-skill">'+esc(sn)+' '+badge
            +'<span id="'+chevId+'" class="ov-expand-icon">&#9658;</span>'
          +'</td>'
          +'<td class="ov-check">'+c1+'</td>'
          +'<td class="ov-check">'+c2+'</td>'
          +'</tr>'
          +indPanel;
      }).join("");

      return '<tr class="ov-family-row">'
        +'<td colspan="3">'+esc(fn)
          +' <span style="font-size:11px;font-weight:400;color:#6A3A9A;margin-left:6px">'
            +famSkills.length+' skill'+(famSkills.length!==1?'s':'')
          +'</span>'
        +'</td></tr>'
        +skillRows;
    }).join("");

    var expandAllBar =
      '<div class="ov-expand-all-bar">'
        +'<button class="ov-expand-btn" onclick="ovExpandAll(true)">&#9660; Expand all indicators</button>'
        +'<button class="ov-expand-btn" onclick="ovExpandAll(false)">&#9650; Collapse all</button>'
        +'<span style="font-size:11px;color:#999;margin-left:auto;align-self:center">Click any skill row to expand its indicators</span>'
      +'</div>';

    var overviewMatrix =
      '<div style="background:#fff;border:1px solid #E0D8F0;border-radius:10px;overflow:hidden;margin-bottom:4px;box-shadow:0 1px 4px rgba(88,44,131,.06)">'
      +'<div style="padding:13px 16px;background:linear-gradient(90deg,#EEE5FA 0%,#F7F4FC 100%);border-bottom:1px solid #E0D8F0;display:flex;align-items:center;gap:10px">'
        +'<span style="font-size:15px;font-weight:800;color:#582C83">Capability Overview</span>'
        +'<span style="font-size:12px;color:#777">Skill-level comparison &mdash; click any row to expand indicators</span>'
      +'</div>'
      +expandAllBar
      +'<div style="overflow-x:auto">'
        +'<table class="ov-table">'
          +'<thead><tr>'
            +'<th>Skill &amp; Status</th>'
            +'<th class="ov-role-col">'+esc(r1.length>22?r1.slice(0,20)+'…':r1)+'</th>'
            +'<th class="ov-role-col">'+esc(r2.length>22?r2.slice(0,20)+'…':r2)+'</th>'
          +'</tr></thead>'
          +'<tbody>'+ovRows+'</tbody>'
        +'</table>'
      +'</div>'
      +'</div>';

    // ── Detail toggle — styled as a proper section header ────────────────────
    var detailId = "cmp-detail";
    var detailChevId = "cmp-detail-chev";
    var detailToggle =
      '<div style="margin-top:20px;background:#fff;border:1px solid #E0D8F0;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(88,44,131,.06)">'
        +'<div onclick="toggleEl(\''+detailId+'\',\''+detailChevId+'\')" style="padding:13px 16px;background:linear-gradient(90deg,#EEE5FA 0%,#F7F4FC 100%);border-bottom:1px solid #E0D8F0;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px">'
          +'<span id="'+detailChevId+'" class="chev"></span>'
          +'<div style="flex:1">'
            +'<span style="font-size:15px;font-weight:800;color:#582C83">Detailed Indicator Comparison</span>'
            +'<span style="display:block;font-size:12px;color:#777;margin-top:2px">Explore side-by-side capability expectations and progression differences between roles. Useful for coaching conversations, development planning, and career progression discussions.</span>'
          +'</div>'
        +'</div>';

    // ── Detailed comparison (existing, now secondary) ─────────────────────────
    var filteredFamilies = unique([].concat(Object.keys(g1),Object.keys(g2)));

    var familyBlocks = filteredFamilies.map(function(fn,fi) {
      var s1 = g1[fn]||{}, s2 = g2[fn]||{};
      var allSkillsInFam = unique([].concat(Object.keys(s1),Object.keys(s2)));
      var bodyId = "cmp-fam-"+fi;
      var chevId = bodyId+"chev";
      var nf1 = Object.keys(s1).length>0, nf2 = Object.keys(s2).length>0;
      var notPills = (!nf1?pill("Not in Role 1","pill-grey"):"")+(!nf2?pill("Not in Role 2","pill-grey"):"");

      var skillRows = allSkillsInFam.map(function(sn) {
        var si1 = s1[sn]||[], si2 = s2[sn]||[];
        var np1 = si1.length===0?'<span style="font-size:11px;color:#aaa;font-weight:400;margin-left:6px">not in Role 1</span>':"";
        var np2 = si2.length===0?'<span style="font-size:11px;color:#aaa;font-weight:400;margin-left:6px">not in Role 2</span>':"";
        var col1inds = si1.length===0
          ? '<div style="padding:8px 0;font-size:12px;color:#bbb;font-style:italic">Not in this role</div>'
          : si1.map(function(ind){return renderIndicatorItem(ind,i2.has(ind)?"shared":"unique1");}).join("");
        var col2inds = si2.length===0
          ? '<div style="padding:8px 0;font-size:12px;color:#bbb;font-style:italic">Not in this role</div>'
          : si2.map(function(ind){return renderIndicatorItem(ind,i1.has(ind)?"shared":"unique2");}).join("");
        return '<div style="border-top:1px solid #EDE8F5">'
          +'<div class="skill-row-header">'+esc(sn)+np1+np2+'</div>'
          +'<div class="compare-skill-grid">'
            +'<div class="compare-col1"><ul class="indicator-list">'+col1inds+'</ul></div>'
            +'<div class="compare-col2"><ul class="indicator-list">'+col2inds+'</ul></div>'
          +'</div>'
          +'</div>';
      }).join("");

      return '<div class="pv-family-block">'
        +'<div class="pv-family-header" onclick="toggleEl(\''+bodyId+'\',\''+chevId+'\')">'
          +'<span style="display:flex;align-items:center;gap:4px">'
            +'<span id="'+chevId+'" class="chev open"></span>'
            +'<span style="font-size:15px;font-weight:800;color:#582C83">'+esc(fn)+'</span>'
          +'</span>'
          +'<div style="display:flex;gap:6px;align-items:center">'
            +notPills
            +'<span style="font-size:12px;color:#777">'+allSkillsInFam.length+' skill'+(allSkillsInFam.length!==1?"s":"")+'</span>'
          +'</div>'
        +'</div>'
        +'<div id="'+bodyId+'">'+skillRows+'</div>'
        +'</div>';
    }).join("");

    var detailHeaders =
      '<div class="compare-header-grid" style="margin-bottom:12px">'
      +'<div class="role-col-header r1"><div><div class="role-col-label">Role 1</div><div class="role-col-name">'+esc(r1)+'</div></div>'+pill(b1,"pill-purple")+'</div>'
      +'<div class="role-col-header r2"><div><div class="role-col-label">Role 2</div><div class="role-col-name">'+esc(r2)+'</div></div>'+pill(b2,"pill-purple")+'</div>'
      +'</div>';

    var legend =
      '<div class="compare-legend">'
      +'<span><span class="legend-dot" style="background:#86C555"></span>In both roles</span>'
      +'<span><span class="legend-dot" style="background:#F58220"></span>Only in Role 1</span>'
      +'<span><span class="legend-dot" style="background:#44C7F4"></span>Only in Role 2</span>'
      +'</div>';

    var detailSection =
      '<div id="'+detailId+'" class="hidden" style="padding:16px">'
        +legend
        +detailHeaders
        +familyBlocks
      +'</div>'
      +'</div>';

    return summaryBar + overviewMatrix + detailToggle + detailSection;

  } catch(e) {
    return '<div class="empty"><div class="sub">Unable to display comparison results. Error: '+esc(String(e))+'</div></div>';
  }
}

function renderGapPanel() {
  const {gapCurrent:rawCur, gapTarget:rawTgt, gapCurrentType, gapTargetType} = state;
  // Resolve positions to their underlying roles
  const cur = gapCurrentType==="position" ? (roleForPosition(rawCur)||rawCur) : rawCur;
  const tgt = gapTargetType==="position" ? (roleForPosition(rawTgt)||rawTgt) : rawTgt;
  const curLabel = rawCur; // display label (may be position title)
  const tgtLabel = rawTgt;
  if (!rawCur||!rawTgt) return `<div class="empty"><div class="icon">&#128506;&#65039;</div><div class="title">Plan your career pathway</div><div class="sub">Select your current and target role (or position title) in the left panel.</div></div>`;
  if (cur===tgt) return `<div class="empty"><div class="sub">Please select a different target role to your current role.</div></div>`;
  const cr = MOCK_DATA.filter(r=>r.role===cur), tr = MOCK_DATA.filter(r=>r.role===tgt);
  if (!cr.length||!tr.length) return `<div class="empty"><div class="sub">One or both selected roles do not have framework data. Please select roles with skills data.</div></div>`;
  const cb = (cr[0]||{}).band||"", tb = (tr[0]||{}).band||"";
  const {have,develop,strengthen} = computeGap(cr,tr);
  const hg = groupByGap(have), dg = groupByGap(develop), sg = groupByGap(strengthen);
  const skillAreas = unique([...Object.keys(dg),...Object.keys(sg)]).length;

  const summaryBar = `<div class="gap-summary-bar">
    <div class="gap-roles-row">
      <div class="gap-role-box current"><div class="gap-role-label">Current Role</div><div class="gap-role-name">${esc(cur)}</div><div class="gap-role-band">${esc(cb)}</div></div>
      <div class="gap-arrow">→</div>
      <div class="gap-role-box target"><div class="gap-role-label">Target Role</div><div class="gap-role-name">${esc(tgt)}</div><div class="gap-role-band">${esc(tb)}</div></div>
    </div>
    <div class="gap-summary-text">To move from <strong>${esc(cur)}</strong> to <strong>${esc(tgt)}</strong>, you need to <strong>develop ${develop.length} new indicator${develop.length!==1?"s":""}</strong> and <strong>strengthen ${strengthen.length} existing indicator${strengthen.length!==1?"s":""}</strong> across <strong>${skillAreas} skill area${skillAreas!==1?"s":""}.</strong></div>
    <div class="gap-stat-pills">
      <div class="gap-stat-pill" style="background:rgba(134,197,85,.25)"><div class="gap-stat-num" style="color:#C8F090">${develop.length}</div><div class="gap-stat-lbl">To develop</div></div>
      <div class="gap-stat-pill" style="background:rgba(245,130,32,.25)"><div class="gap-stat-num" style="color:#FFD4A0">${strengthen.length}</div><div class="gap-stat-lbl">To strengthen</div></div>
      <div class="gap-stat-pill" style="background:rgba(255,255,255,.15)"><div class="gap-stat-num" style="color:#fff">${skillAreas}</div><div class="gap-stat-lbl">Skill areas</div></div>
    </div>
  </div>`;

  function renderGapSection(title,subtitle,icon,type,grouped,headerStyle,accentColor,accentBg) {
    const families = Object.keys(grouped);
    const total = families.reduce((n,f)=>n+Object.values(grouped[f]).reduce((m,a)=>m+a.length,0),0);
    if (total===0) return `<div class="gap-section-empty"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">${icon}</span><span style="font-size:14px;font-weight:700;color:#444">${title}</span>${pill("None","pill-grey")}</div><div style="font-size:13px;color:#777;margin-top:6px">No indicators in this category for the selected roles.</div></div>`;
    const famBlocks = families.map((fn,fi)=>{
      const skillsData = grouped[fn];
      const skillNames = Object.keys(skillsData);
      const total2 = skillNames.reduce((n,s)=>n+skillsData[s].length,0);
      const bodyId = "gf-"+type+"-"+fi;
      const skillBlocks = skillNames.map((sn,si)=>{
        const items = skillsData[sn];
        const bodyId2 = "gs-"+type+"-"+fi+"-"+si;
        const indHtml = items.map(item=>{
          const iconMap = {have:{cls:"have",ic:"✓",icCls:"icon-have"},develop:{cls:"develop",ic:"→",icCls:"icon-develop"},strengthen:{cls:"strengthen",ic:"↑",icCls:"icon-strengthen"}};
          const cfg = iconMap[type]||iconMap.develop;
          const canDev = (type==="develop"||type==="strengthen");
          var actionsHtml = "";
          if (canDev) {
            actionsHtml = '<div class="gap-ind-actions">'
              + '<button class="gap-ind-link dr-open-dev"'
              + ' data-sc="' + esc(item.skill_code) + '"'
              + ' data-ind="' + esc(item.indicator) + '"'
              + ' data-sn="' + esc(sn) + '"'
              + ' data-type="' + esc(type) + '"'
              + ' data-cur="' + esc(cur) + '"'
              + ' data-tgt="' + esc(tgt) + '"'
              + '>How to develop \u2192</button>'
              + '<button class="gap-ind-link goal dr-open-goal"'
              + ' data-sc="' + esc(item.skill_code) + '"'
              + ' data-ind="' + esc(item.indicator) + '"'
              + ' data-sn="' + esc(sn) + '"'
              + ' data-type="' + esc(type) + '"'
              + ' data-cur="' + esc(cur) + '"'
              + ' data-tgt="' + esc(tgt) + '"'
              + '>Create a goal \u2192</button>'
              + '</div>';
          }
          return '<li class="gap-indicator" style="padding:0;border:none;background:none;margin-bottom:0">'
            + '<div class="gap-ind-compact">'
              + '<div class="gap-ind-text"><span class="gap-ind-icon2 ' + cfg.icCls + '">' + cfg.ic + '</span>' + esc(item.indicator) + '</div>'
              + actionsHtml
            + '</div>'
            + '</li>';
        }).join("");
        return `<div class="gap-skill-block">
          <div class="gap-skill-header" onclick="toggleEl('${bodyId2}','${bodyId2}chev')">
            <span class="skill-title">${chevron(false).replace('class="chev"',`id="${bodyId2}chev" class="chev"`)}${esc(sn)}</span>
            <span class="skill-count">${items.length} indicator${items.length!==1?"s":""}</span>
          </div>
          <div id="${bodyId2}" class="hidden"><ul class="gap-indicator-list">${indHtml}</ul></div>
        </div>`;
      }).join("");
      return `<div class="gap-family-block">
        <div class="gap-family-header" style="background:${accentBg}" onclick="toggleEl('${bodyId}','${bodyId}chev')">
          <span class="gap-family-title" style="color:${accentColor}">${chevron(false).replace('class="chev"',`id="${bodyId}chev" class="chev"`)}${esc(fn)}</span>
          <span style="font-size:12px;color:${accentColor};opacity:.75">${total2} indicator${total2!==1?"s":""}</span>
        </div>
        <div id="${bodyId}" class="hidden">${skillBlocks}</div>
      </div>`;
    }).join("");
    return `<div class="gap-section">
      <div class="gap-section-header" style="${headerStyle}">
        <div class="gap-section-icon">${icon}</div>
        <div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="gap-section-title" style="color:${accentColor}">${title}</span>${pill(total+" indicator"+(total!==1?"s":""),"pill-grey")}</div>
        <div class="gap-section-sub">${subtitle}</div></div>
      </div>

// ── POSITION PANEL (shown in Role View when a role has mapped positions) ─────
function renderPositionBanner(role) {
  const positions = positionsForRole(role);
  if (!positions.length) return "";
  const uniqueUnits = [...new Set(positions.map(p=>p.org_unit).filter(Boolean))];
  const uniqueTitles = [...new Set(positions.map(p=>p.position_title).filter(Boolean))];
  const insight = `This role is currently used across <strong>${positions.length} position${positions.length!==1?"s":""}</strong> in <strong>${uniqueUnits.length} service area${uniqueUnits.length!==1?"s":""}</strong>.`;
  const panelId = "pos-panel-body";
  // Group by position title for display (show title + units)
  const byTitle = {};
  positions.forEach(p=>{ if(!byTitle[p.position_title]) byTitle[p.position_title]={titles:new Set(),units:new Set(),portfolio:p.portfolio}; byTitle[p.position_title].units.add(p.org_unit); });
  const rows = Object.entries(byTitle).map(([title,data])=>
    `<tr><td>${esc(title)}</td><td>${[...data.units].sort().map(u=>esc(u)).join(", ")}</td><td>${esc(displayPortfolio(data.portfolio||""))}</td></tr>`
  ).join("");
  return `<div class="pos-panel">
    <div class="pos-panel-title">&#127970; Organisational Positions Using This Role</div>
    <div class="pos-insight">${insight}</div>
    <p style="font-size:12px;color:#555;margin-bottom:8px">This role is used across the following positions and service areas.</p>
    <button class="pos-toggle" onclick="toggleEl('${panelId}','${panelId}chev')">
      <span id="${panelId}chev" class="chev open"></span>Show / hide positions
    </button>
    <div id="${panelId}" style="margin-top:10px;overflow-x:auto">
      <table class="pos-table">
        <thead><tr><th>Position Title</th><th>Organisation Unit(s)</th><th>Portfolio</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ── Position View: flat framework display ─────────────────────────────────────
// Skill Families are collapsible. Skills and indicators are always visible —
// no click required. This is intentionally different from Role View.
function renderPositionFamilySection(familyName, skills, fid) {
  try {
    var bodyId = "pvf-" + fid;
    var chevId = bodyId + "chev";
    var skillNames = Object.keys(skills || {});
    if (!skillNames.length) return "";
    var totalIndicators = skillNames.reduce(function(n,s){ return n + (skills[s]||[]).length; }, 0);

    var skillsHtml = skillNames.map(function(sn) {
      var indicators = skills[sn] || [];
      var indsHtml = indicators.map(function(ind) {
        return '<div class="pv-indicator">' + esc(ind) + '</div>';
      }).join("");
      return '<div class="pv-skill-block">'
        + '<div class="pv-skill-name">' + esc(sn) + '</div>'
        + indsHtml
        + '</div>';
    }).join("");

    return '<div class="pv-family-block">'
      + '<div class="pv-family-header" onclick="toggleEl(\'' + bodyId + '\',\'' + chevId + '\')">'
        + '<span style="display:flex;align-items:center;gap:4px">'
          + '<span id="' + chevId + '" class="chev open"></span>'
          + '<span style="font-size:15px;font-weight:800;color:#582C83;letter-spacing:-.2px">' + esc(familyName) + '</span>'
        + '</span>'
        + '<span style="font-size:12px;color:#777">' + skillNames.length + ' skill' + (skillNames.length!==1?"s":"") + ' &middot; ' + totalIndicators + ' indicator' + (totalIndicators!==1?"s":"") + '</span>'
      + '</div>'
      + '<div id="' + bodyId + '">' + skillsHtml + '</div>'
      + '</div>';
  } catch(e) {
    return '<div style="padding:12px 16px;color:#954D00;font-size:13px">Unable to display framework content for <strong>' + esc(familyName) + '</strong>.</div>';
  }
}

// ── POSITION VIEW panel ───────────────────────────────────────────────────────

        </div>
      </div>
    </div>`;

  // Divider with flow arrow

    <div style="display:flex;align-items:center;gap:10px;margin:16px 0;color:#AAA;font-size:12px;font-weight:700">
      <div style="flex:1;height:1px;background:#EDE8F5"></div>
      <span>&#8595; Framework Role &amp; Capability Expectations</span>
      <div style="flex:1;height:1px;background:#EDE8F5"></div>

  // ── SECTION B: Framework Role Profile ─────────────────────────────────────

  const rp = getProfile(mappedRole);

    <div style="margin-bottom:6px;font-size:11px;font-weight:800;color:#777;text-transform:uppercase;letter-spacing:.08em">Framework Role Profile</div>
    <div class="rp-card">

      <div class="rp-meta-row">
        <span class="rp-meta-item"><span class="rp-meta-label">Framework Role</span><span style="color:#333;font-weight:700">${esc(mappedRole)}</span></span>
        <span style="color:#DDD">|</span>
        <span class="rp-meta-item"><span class="rp-meta-label">Category</span><span style="color:#333">${esc(rp.role_category)}</span></span>
        <span style="color:#DDD">|</span>
        <span class="rp-meta-item"><span class="rp-meta-label">Band</span><span style="color:#333">${esc(rp.band)}</span></span>
        <span style="color:#DDD">|</span>
        <span class="rp-meta-item"><span class="rp-meta-label">Leadership</span><span class="rp-badge ${rp.leadership_level==="Leading Self"?"rp-badge-self":rp.leadership_level==="Leading Others"?"rp-badge-others":"rp-badge-leaders"}">${esc(rp.leadership_level)}</span></span>

    const grouped = groupBy(recs);

        <p style="font-size:12px;color:#777;margin-bottom:14px">Capability indicators linked from the <strong>${esc(mappedRole)}</strong> framework role.</p>
        <div class="stats-row">

          <div class="stat-tile"><div class="val">${stats.skills}</div><div class="lbl">Skills</div></div>

  // ── Other positions using this framework role ─────────────────────────────
  const allRolePositions = POSITION_DATA.filter(p=>p.role===mappedRole);

            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  } else {
    otherHtml = `
      <div class="pos-other-section">
        <div class="pos-other-title">&#127970; Other positions using this framework role</div>

}

      +'</div>'

        +'<button class="mydev-card primary" onclick="setDevMode(\'current\')" '+(curRole?'':'disabled style="opacity:.5;cursor:not-allowed"')+'>'
          +'<div class="mydev-card-icon">&#127919;</div>'

          +'<div class="mydev-card-desc">Choose a skill to strengthen and create a development goal for your PDR.</div>'

function renderCurrentDevPanel(curRole, curBand) {
  if (!curRole) {
    return '<div class="empty"><div class="icon">&#127919;</div>'
      +'<div class="title">Select your current role</div>'
      +'<div class="sub">Choose your role in the left panel, then return here to start developing.</div></div>';
  }

  // Group role indicators by family → skill
  var recs = MOCK_DATA.filter(function(r){return r.role===curRole;});
  if (!recs.length) {
    return '<div class="empty"><div class="sub">No framework data found for '+esc(curRole)+'.</div></div>';
  }

  var grouped = groupBy(recs);
  var families = Object.keys(grouped);

  var familiesHtml = families.map(function(fn, fi) {
    var skills = grouped[fn];
    var skillNames = Object.keys(skills);
    var total = skillNames.reduce(function(n,s){return n+skills[s].length;},0);
    var bodyId = "mydev-fam-"+fi;
    var chevId = bodyId+"-chev";

    var skillsHtml = skillNames.map(function(sn) {
      var indicators = skills[sn];
      var indsHtml = indicators.map(function(ind) {
        // Find the skill_code for this indicator
        var rec = recs.find(function(r){return r.skill===sn && r.indicator===ind;});
        var sc = rec ? rec.skill_code : "";
        return '<div class="mydev-ind-row">'
          +'<span class="mydev-ind-text">'+esc(ind)+'</span>'
          +'<button class="mydev-ind-btn dr-open-dev"'
            +' data-sc="'+esc(sc)+'"'
            +' data-ind="'+esc(ind)+'"'
            +' data-sn="'+esc(sn)+'"'
            +' data-type="current"'
            +' data-cur="'+esc(curRole)+'"'
            +' data-tgt=""'
          +'>Develop this skill &#8594;</button>'
          +'</div>';
      }).join("");
      return '<div class="mydev-skill-group">'
        +'<div class="mydev-skill-name">'+esc(sn)+'</div>'
        +indsHtml
        +'</div>';
    }).join("");

    return '<div class="mydev-skill-fam">'
      +'<div class="mydev-fam-header" onclick="toggleEl(\''+bodyId+'\',\''+chevId+'\')">'
        +'<span id="'+chevId+'" class="chev open"></span>'
        +'<span class="mydev-fam-title">'+esc(fn)+'</span>'
        +'<span class="mydev-fam-count">'+skillNames.length+' skill'+(skillNames.length!==1?'s':'')+' &middot; '+total+' indicator'+(total!==1?'s':'')+'</span>'
      +'</div>'
      +'<div id="'+bodyId+'">'+skillsHtml+'</div>'
      +'</div>';
  }).join("");

  return '<div class="mydev-current">'
    +'<button class="mydev-back" onclick="setDevMode(\'\')">&#9664; Back to My Development</button>'
    +'<div class="mydev-current-intro">'
      +'<div class="mydev-role-badge">&#127891; '+esc(curRole)+(curBand?' &middot; '+esc(curBand):'')+'</div>'
      +'<h2>What would you like to strengthen?</h2>'
      +'<p>Your PDR is an opportunity to think about how you\'d like to grow in your current role. Choose a skill you\'d like to strengthen and we\'ll help you turn it into a practical development goal.</p>'
    +'</div>'
    +familiesHtml
    +'</div>';
}

      <div>
        <div class="sb-label">Search Indicators</div>
        <p class="sb-hint">Filter by keyword within indicator text.</p>
        <div class="search-wrap">
          ${hasSelection
            ? `<input type="text" id="sb-search-input" placeholder="e.g. risk, housing, referral..."
                 value="${esc(search)}"
                 oninput="setSearch(this.value)"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();}if(event.key==='Escape'){event.preventDefault();clearSearch();}"
               />${search?'<button class="search-clear" onclick="clearSearch()">&#215;</button>':""}`
            : `<input type="text" disabled style="opacity:.45;cursor:not-allowed"
                 placeholder="${state.mode==='position'?'Select a position first to search its indicators':'Select a role first to search its indicators'}"
               />`
          }
        </div>
      </div>
      <div>
        <div class="sb-label">Filter by Skill Family</div>
        ${hasSelection
          ? `<p class="sb-hint">Narrow results to one skill family.</p>
             <select onchange="setFamilyFilter(this.value)"><option value="">All Skill Families</option>${famOpts}</select>
             ${clearFamBtn}`
          : `<p class="sb-hint" style="color:#F58220">Select a role first, then filter by skill family.</p>
             <select disabled style="opacity:.45;cursor:not-allowed"><option value="">All Skill Families</option></select>`
        }
      </div>`;
  }

  const exportRecs = mode==="position"
    ? POSITION_DATA.filter(p=>p.position_title===state.selectedPosition)
    : mode==="compare"
    ? MOCK_DATA.filter(r=>r.role===compareRole1||r.role===compareRole2)
    : mode==="gap"
    ? MOCK_DATA.filter(r=>r.role===gapCurrent||r.role===gapTarget)
    : filterRecords(selectedRole,search,familyFilter);
  const canExport = exportRecs.length>0;

  return `
    <div><div class="sb-label">View Mode</div><div class="mode-btns">${modeButtons}</div></div>
    <div class="sb-divider"></div>
    ${roleSel}
    ${filters}
    <div class="spacer"></div>
    <div>
      <div class="sb-label">Export</div>
      <p class="sb-hint">Download results as a spreadsheet (.csv).</p>
      <button class="export-btn" onclick="doExport()" ${canExport?"":'disabled="disabled"'}>&#8595; Export CSV</button>
    </div>`;
}

function setDevMode(v){ state.devMode=v; render(); }
function setPosition(v){ state.selectedPosition=v; render(); }
function toggleGapType(which){
  if(which==="current"){ state.gapCurrentType = state.gapCurrentType==="role"?"position":"role"; state.gapCurrent=""; }
  else { state.gapTargetType = state.gapTargetType==="role"?"position":"role"; state.gapTarget=""; }

}
function doExport(){
  const {mode,selectedRole,compareRole1,compareRole2,gapCurrent,gapTarget,gapCurrentType,gapTargetType,selectedPosition,search,familyFilter}=state;
  if (mode==="position") {
    // Export position data
    const matches = POSITION_DATA.filter(p=>p.position_title===selectedPosition);
    var headers2 = ["position_title","role","band","portfolio","org_unit"];
    var rows2 = matches.map(function(r){ return headers2.map(function(h){ var v=(h==="portfolio"?displayPortfolio(r[h]):r[h])||""; return '"'+v.split('"').join('""')+'"'; }).join(","); });
    var csv2 = headers2.join(",") + "\n" + rows2.join("\n");
    var blob2 = new Blob([csv2],{type:"text/csv"}); var url2=URL.createObjectURL(blob2); var a2=document.createElement("a"); a2.href=url2; a2.download="position-export.csv"; a2.click(); URL.revokeObjectURL(url2);
    return;
  }
  const curRole = gapCurrentType==="position"?(roleForPosition(gapCurrent)||gapCurrent):gapCurrent;
  const tgtRole = gapTargetType==="position"?(roleForPosition(gapTarget)||gapTarget):gapTarget;
  var recs = mode==="compare"
    ? MOCK_DATA.filter(r=>r.role===compareRole1||r.role===compareRole2)
    : mode==="gap"
    ? MOCK_DATA.filter(r=>r.role===curRole||r.role===tgtRole)
    : filterRecords(selectedRole,search,familyFilter);
  exportCSV(recs);
}

// Single active builder — stores which HTD panel's goal builder is open
var DG = { activeId: "" };

// Called by the "Create a development goal →" CTA inside renderHowToDevelop
function dgShow(builderId, indicator, skillCode, skillName, type, curRole, tgtRole) {
  // Close any other open builder
  if (DG.activeId && DG.activeId !== builderId) {
    var prev = document.getElementById(DG.activeId);
    if (prev) prev.style.display = "none";
  }
  DG.activeId = builderId;
  var el = document.getElementById(builderId);
  if (!el) return;
  // If already rendered, just show it
  if (el.dataset.rendered === "1") { el.style.display = ""; el.scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
  el.dataset.rendered = "1";

  var s = SKILL_DEV[skillCode] || DEFAULT_DEV;
  var cats = [
    {key:"experience", label:"Experience", items: s.experience||[]},
    {key:"exposure",   label:"Exposure",   items: s.exposure||[]},
    {key:"education",  label:"Education",  items: s.education||[]}
  ];

  var purpose = type === "develop"
    ? "Building new capability toward <strong>" + esc(tgtRole) + "</strong>"
    : "Strengthening existing capability toward <strong>" + esc(tgtRole) + "</strong>";

  var catHtml = cats.map(function(cat) {
    if (!cat.items.length) return "";
    var opts = cat.items.map(function(text, i) {
      var cbId = builderId + "-" + cat.key + "-" + i;
      return '<label class="dg-option" for="' + cbId + '">'
        + '<input type="checkbox" id="' + cbId + '" data-cat="' + cat.key + '" data-idx="' + i + '" onchange="dgCheck(\'' + builderId + '\')">'
        + '<span class="dg-option-text">' + esc(text) + '</span>'
        + '</label>';
    }).join("");
    return '<div>'
      + '<div class="dg-cat-label">' + cat.label + '</div>'
      + '<div class="dg-options">' + opts + '</div>'
      + '</div>';
  }).join("");

  el.innerHTML = '<div class="dg-builder">'
    + '<div class="dg-builder-hdr">'
      + '<div style="flex:1">'
        + '<div class="dg-builder-title">Create a development goal</div>'
        + '<div class="dg-builder-skill">' + esc(skillName) + '</div>'
        + '<div class="dg-builder-indicator">' + esc(indicator) + '</div>'
        + '<div style="font-size:11px;color:#7A5AAA;margin-top:5px">' + purpose + '</div>'
      + '</div>'
      + '<button class="dg-close-x" onclick="dgHide(\'' + builderId + '\')">&#215;</button>'
    + '</div>'
    + '<div class="dg-body" id="' + builderId + '-body">'
      + '<div>'
        + '<div style="font-size:12px;color:#444;margin-bottom:10px">Select the activities that work for you:</div>'
        + catHtml
      + '</div>'
      + '<div class="dg-ctx-wrap">'
        + '<div class="dg-ctx-label">Anything you\u2019d like to add? <span style="font-weight:400;color:#999">(optional)</span></div>'
        + '<div class="dg-ctx-hint">Add a project, opportunity or timeframe you\u2019d like included.</div>'
        + '<textarea class="dg-ctx-input" id="' + builderId + '-ctx" placeholder="e.g. as part of our team project over the next quarter\u2026" oninput="dgCheck(\'' + builderId + '\')"></textarea>'
      + '</div>'
      + '<button class="dg-create-btn" id="' + builderId + '-gen" disabled onclick="dgGenerate(\'' + builderId + '\',\'' + esc(indicator).replace(/'/g,"\\'") + '\',\'' + esc(skillName).replace(/'/g,"\\'") + '\',\'' + esc(skillCode) + '\',\'' + type + '\',\'' + esc(tgtRole).replace(/'/g,"\\'") + '\')">Create my development goal</button>'
    + '</div>'
    + '<div id="' + builderId + '-result" class="dg-result hidden"></div>'
  + '</div>';

  el.style.display = "";
  setTimeout(function(){ el.scrollIntoView({behavior:"smooth",block:"nearest"}); }, 50);
}

function dgCheck(builderId) {
  var any = document.querySelectorAll('#' + builderId + ' input[type=checkbox]:checked').length > 0;
  var ctx = ((document.getElementById(builderId + '-ctx')||{}).value||"").trim();
  var btn = document.getElementById(builderId + '-gen');
  if (btn) btn.disabled = !(any || ctx.length);
}

function dgGenerate(builderId, indicator, skillName, skillCode, type, tgtRole) {
  var s = SKILL_DEV[skillCode] || DEFAULT_DEV;
  var cats = {experience:s.experience||[], exposure:s.exposure||[], education:s.education||[]};

  var selected = [];
  var checked = document.querySelectorAll('#' + builderId + ' input[type=checkbox]:checked');
  checked.forEach(function(cb) {
    var arr = cats[cb.dataset.cat]||[];
    var idx = parseInt(cb.dataset.idx);
    if (arr[idx]) selected.push(arr[idx]);
  });
  var ctx = ((document.getElementById(builderId+'-ctx')||{}).value||"").trim();
  if (ctx) selected.push(ctx);
  if (!selected.length) return;

  var purposeVerb = type === "develop" ? "build" : "strengthen";
  var goal = "";
  if (selected.length === 1) {
    var a = selected[0].charAt(0).toLowerCase() + selected[0].slice(1).replace(/\.\s*$/, "");
    goal = "I will " + a + " to " + purposeVerb + " my capability in " + skillName + ".";
  } else {
    goal = "To " + purposeVerb + " my capability in " + skillName + ", I will:\n";
    selected.forEach(function(act) {
      var a = act.charAt(0).toLowerCase() + act.slice(1).replace(/\.\s*$/, "");
      goal += "\u2022 " + a + "\n";
    });
    goal = goal.trimEnd() + ".";
  }
  goal += "\n\nIndicator: " + indicator;
  if (tgtRole) goal += "\nTarget role: " + tgtRole;

  var resultDiv = document.getElementById(builderId + '-result');
  if (!resultDiv) return;
  resultDiv.innerHTML =
    '<div class="dg-result-label">Your development goal</div>'
    + '<textarea class="dg-result-ta" id="' + builderId + '-ta" spellcheck="true">' + goal + '</textarea>'
    + '<div class="dg-result-hint">You can edit this before copying. Paste it into Culture Amp or your development plan.</div>'
    + '<div class="dg-result-actions">'
      + '<button class="dg-copy-btn" id="' + builderId + '-copy" onclick="dgCopy(\'' + builderId + '\')">Copy goal</button>'
      + '<button class="dg-retry-btn" onclick="dgRetry(\'' + builderId + '\',\'' + esc(indicator).replace(/'/g,"\\'") + '\',\'' + esc(skillName).replace(/'/g,"\\'") + '\',\'' + esc(skillCode) + '\',\'' + type + '\',\'' + esc(tgtRole).replace(/'/g,"\\'") + '\')">Try another version</button>'
      + '<button class="dg-back-btn" onclick="dgBack(\'' + builderId + '\')">Choose different activities</button>'
    + '</div>';
  resultDiv.classList.remove('hidden');

  // Collapse the form body, show result
  var body = document.getElementById(builderId + '-body');
  if (body) body.style.display = 'none';
  resultDiv.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function dgRetry(builderId, indicator, skillName, skillCode, type, tgtRole) {
  dgGenerate(builderId, indicator, skillName, skillCode, type, tgtRole);
}

function dgBack(builderId) {
  var body = document.getElementById(builderId + '-body');
  var result = document.getElementById(builderId + '-result');
  if (body) body.style.display = '';
  if (result) result.classList.add('hidden');
}

function dgCopy(builderId) {
  var ta = document.getElementById(builderId + '-ta');
  if (!ta) return;
  navigator.clipboard.writeText(ta.value).catch(function(){
    ta.select(); document.execCommand('copy');
  });
  var btn = document.getElementById(builderId + '-copy');
  if (btn) {
    btn.textContent = '✓ Copied!'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = 'Copy goal'; btn.classList.remove('copied'); }, 2500);
  }
}

function dgHide(builderId) {
  var el = document.getElementById(builderId);
  if (el) el.style.display = 'none';
  if (DG.activeId === builderId) DG.activeId = '';
}
