<title>Workforce Skills Framework — Framework Review Tool</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F7F6FB;color:#111;font-size:15px;line-height:1.6}
button,select,input{font-family:inherit;cursor:pointer}

.site-header{background:linear-gradient(135deg,#400D71 0%,#582C83 100%);padding:22px 32px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;box-shadow:0 2px 16px rgba(88,44,131,.3)}
.site-header h1{color:#fff;font-size:22px;font-weight:800;letter-spacing:-.3px}
.site-header p{color:rgba(255,255,255,.7);font-size:13px;margin-top:4px;max-width:480px}
.header-stats{display:flex;gap:20px;flex-wrap:wrap}
.hstat{text-align:center}
.hstat-num{font-size:22px;font-weight:800;color:#fff;line-height:1}
.hstat-lbl{font-size:10px;color:rgba(255,255,255,.55);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

.consult-banner{background:#fff;border-left:4px solid #582C83;margin:24px 32px 0;border-radius:8px;padding:16px 20px;font-size:13px;color:#444;line-height:1.6;box-shadow:0 1px 4px rgba(88,44,131,.07)}
.consult-banner strong{color:#582C83}
.consult-banner ul{margin:8px 0 0 18px}
.consult-banner li{margin-bottom:3px}

#landing{padding:24px 32px}
.landing-title{font-size:18px;font-weight:800;color:#582C83;margin-bottom:6px}
.landing-sub{font-size:13px;color:#777;margin-bottom:20px;max-width:600px}
.search-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search-row input{flex:1;min-width:220px;padding:10px 14px;border:1px solid #E0D8F0;border-radius:8px;font-size:14px;outline:none;background:#fff}
.search-row input:focus{border-color:#582C83;box-shadow:0 0 0 2px rgba(88,44,131,.1)}
.band-filter{padding:10px 12px;border:1px solid #E0D8F0;border-radius:8px;font-size:13px;background:#fff;outline:none}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.role-card{background:#fff;border:1px solid #E0D8F0;border-radius:10px;padding:16px 18px;cursor:pointer;transition:all .12s;box-shadow:0 1px 4px rgba(88,44,131,.05)}
.role-card:hover{border-color:#582C83;box-shadow:0 3px 12px rgba(88,44,131,.15);transform:translateY(-1px)}
.role-card-name{font-size:14px;font-weight:800;color:#111;margin-bottom:6px;line-height:1.3}
.role-card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.tag-band{background:#EDE8F5;color:#582C83}
.tag-cat{background:#F0F0F0;color:#555}
.tag-ll-self{background:#EDE8F5;color:#582C83}
.tag-ll-others{background:#E0F3FF;color:#1A6A9A}
.tag-ll-leaders{background:#FFF0E0;color:#954D00}
.role-card-stat{font-size:12px;color:#999}
.no-results{text-align:center;padding:48px;color:#777;font-size:14px}

#role-page{padding:24px 32px;display:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid #E0D8F0;border-radius:7px;padding:7px 14px;font-size:13px;font-weight:700;color:#582C83;cursor:pointer;margin-bottom:20px}
.back-btn:hover{background:#EDE8F5}
.nav-row{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.nav-btn{background:#fff;border:1px solid #E0D8F0;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:700;color:#444}
.nav-btn:hover:not(:disabled){border-color:#582C83;color:#582C83}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-label{font-size:12px;color:#999;flex:1;text-align:center}

.role-header-card{background:#fff;border:1px solid #E0D8F0;border-radius:12px;padding:24px 28px;margin-bottom:20px;box-shadow:0 1px 6px rgba(88,44,131,.07)}
.role-header-card h2{font-size:26px;font-weight:800;letter-spacing:-.4px;color:#111;margin-bottom:10px}
.role-meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.role-profile-text{font-size:14px;color:#333;line-height:1.75;background:#F7F4FC;border-left:4px solid #582C83;padding:14px 18px;border-radius:0 8px 8px 0}

.section-header{font-size:18px;font-weight:800;color:#582C83;margin:28px 0 6px}
.section-sub{font-size:13px;color:#777;margin-bottom:14px}
.family-block{background:#fff;border:1px solid #E0D8F0;border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(88,44,131,.05)}
.family-header{padding:14px 20px;background:linear-gradient(90deg,#EEE5FA 0%,#F7F4FC 100%);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:10px}
.family-header:hover{background:linear-gradient(90deg,#E5D8F7 0%,#F0ECF9 100%)}
.family-title{font-size:16px;font-weight:800;color:#582C83;display:flex;align-items:center;gap:8px}
.family-count{font-size:12px;color:#777;white-space:nowrap}
.skill-block{border-top:1px solid #EDE8F5;padding:14px 20px 10px 26px}
.skill-name{font-size:14px;font-weight:700;color:#333;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.skill-name::before{content:'';display:inline-block;width:3px;height:14px;background:#582C83;border-radius:2px;flex-shrink:0}
.indicator{font-size:13px;color:#444;padding:6px 0 6px 14px;border-left:2px solid #EDE8F5;margin:4px 0;line-height:1.55}

.chev{display:inline-block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid #582C83;transition:transform .15s;flex-shrink:0}
.chev.open{transform:rotate(90deg)}

.positions-section{margin-top:28px}
.pos-table{width:100%;border-collapse:collapse;font-size:13px}
.pos-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#582C83;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #EDE8F5;background:#FDFCFF;white-space:nowrap}
.pos-table td{padding:8px 12px;border-bottom:1px solid #F0EAF9;vertical-align:top}
.pos-table tr:hover td{background:rgba(88,44,131,.02)}

.related-section{margin-top:28px;padding-bottom:40px}
.related-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.related-chip{background:#fff;border:1px solid #D4C8EE;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;color:#582C83;cursor:pointer;transition:all .1s}
.related-chip:hover{background:#582C83;color:#fff}

@media(max-width:600px){
  .site-header,.consult-banner,#landing,#role-page{padding:16px}
  .role-grid{grid-template-columns:1fr}
}

/* Consultation flat layout */
.c-back-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.c-back-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #582C83;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:800;color:#582C83;cursor:pointer;transition:all .12s}
.c-back-btn:hover{background:#582C83;color:#fff}
.c-role-counter{font-size:13px;color:#999;font-weight:600}
.c-family-block{margin-bottom:28px}
.c-family-header{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;border-bottom:2px solid #582C83;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.c-family-title{font-size:17px;font-weight:800;color:#582C83}
.c-family-count{font-size:12px;color:#888;font-weight:600}

.c-skill-name{font-size:15px;font-weight:700;color:#222;margin-bottom:8px;padding-left:12px;border-left:3px solid #582C83}
.c-indicator{font-size:14px;color:#333;padding:5px 0 5px 28px;line-height:1.6;position:relative}
.c-indicator::before{content:"";position:absolute;left:12px;top:13px;width:5px;height:5px;border-radius:50%;background:#ABA3C0;flex-shrink:0}

</style>

var ROLE_PROFILES = [{"role_id": "RL001", "framework_role": "Brokerage Administration Worker", "role_category": "Administration", "band": "2", "leadership_level": "Leading Self", "role_profile": "Brokerage Administration Workers support the effective administration of the Housing Establishment Fund (HEF) and other internal brokerage funds. They ensure accurate processing of invoices and financial records, monitor expenditure, and liaise with suppliers and internal stakeholder to support timely and compliant administration."}, {"role_id": "RL002", "framework_role": "Concierge & Administration Worker", "role_category": "Administration", "band": "3", "leadership_level": "Leading Self", "role_profile": "Concierge & Administration Workers provide front-of-house, administrative and operational support to maintain safe, welcoming and effective service environments. They support day-to-day service operations through reception and concierge functions, monitoring site access, maintaining records and systems, coordinating resources and responding to enquiries and incidents."}, {"role_id": "RL003", "framework_role": "Wellbeing Officer", "role_category": "Support Services", "band": "3", "leadership_level": "Leading Self", "role_profile": "Wellbeing Officers support the health, wellbeing and social inclusion of individuals through day-to-day engagement, wellbeing activities and community participation. They create welcoming and supportive environments, facilitate programs and activities, and work collaboratively with internal and external stakeholders to promote wellbeing outcomes."}, {"role_id": "RL004", "framework_role": "After Hours Support Worker", "role_category": "Support Services", "band": "4", "leadership_level": "Leading Self", "role_profile": "After-Hours Support Workers provide responsive after-hours support to individuals experiencing or at risk of homelessness. They assess and respond to immediate needs, risks and incidents, support safety and wellbeing within residential environments, provide practical assistance and maintain effective coordination with internal teams and external services."}, {"role_id": "RL005", "framework_role": "AOF Worker", "role_category": "Case Management", "band": "4", "leadership_level": "Leading Self", "role_profile": "AOF Workers provide case management and coordinated support to individuals and families experiencing or at risk of homelessness. They assess needs, develop and review support plans, coordinate services, advocate for access to housing and supports, and assist individuals to achieve stable housing and wellbeing outcomes."}, {"role_id": "RL006", "framework_role": "Case Manager", "role_category": "Case Management", "band": "4", "leadership_level": "Leading Self", "role_profile": "Case Managers provide coordinated, person-centred case management support to individuals experiencing or at risk of homelessness. They conduct assessments, develop and implement case plans, coordinate services and supports, advocate for access to resources and services, and support individuals to achieve housing, wellbeing and independence goals."}, {"role_id": "RL007", "framework_role": "Housing Transition Worker", "role_category": "Case Management", "band": "4", "leadership_level": "Leading Self", "role_profile": "Housing Transitions Workers support individuals to transition into, within and out of services and housing environments. They coordinate transition-related supports, facilitate housing readiness and life skills development, support tenancy sustainment, and work collaboratively with internal teams, housing providers and external services to achieve successful housing outcomes."}, {"role_id": "RL008", "framework_role": "IAP Woker", "role_category": "Intake & Assessment", "band": "4", "leadership_level": "Leading Self", "role_profile": "IAP Workers provide intake, assessment, triage and short-term support to individuals experiencing or at risk of homelessness. They assess needs and risks, determine eligibility for services, facilitate referrals and coordinated access to housing and support pathways, and support individuals to address immediate needs and goals."}, {"role_id": "RL009", "framework_role": "Intake Worker", "role_category": "Intake & Assessment", "band": "4", "leadership_level": "Leading Self", "role_profile": "Intake Workers provide initial engagement, intake and assessment services to individuals accessing support. They identify immediate needs and risks, coordinate intake processes, provide information and orientation to services, and facilitate timely access to appropriate supports and referral pathways."}, {"role_id": "RL010", "framework_role": "Private Rental Assistance Worker", "role_category": "Case Management", "band": "4", "leadership_level": "Leading Self", "role_profile": "Private Rental Assistance Workers support individuals and families to access and sustain housing within the private rental market. They provide case management, tenancy support and financial assistance, build relationships with housing providers and real estate agencies, and coordinate supports to improve housing stability and outcomes."}, {"role_id": "RL011", "framework_role": "Residential Engagement Officer", "role_category": "Support Services", "band": "4", "leadership_level": "Leading Self", "role_profile": "Resident Engagement Officers support tenant wellbeing, engagement and community participation within residential service environments. They build trust-based relationships with tenants, respond to wellbeing and safety concerns, coordinate access to communal spaces and supports, and work collaboratively with internal teams and external services to promote safe and connected communities."}, {"role_id": "RL012", "framework_role": "MS2H Worker", "role_category": "Outreach", "band": "4", "leadership_level": "Leading Self", "role_profile": "MS2H Workers provide assertive outreach and intensive case management support to individuals experiencing chronic homelessness and complex needs. They use persistent engagement approaches, conduct comprehensive assessments, coordinate services and supports, maintain engagement through periods of instability or crisis, and advocate to improve access to housing and support services."}, {"role_id": "RL013", "framework_role": "Assertive Outreach Worker", "role_category": "Outreach", "band": "4", "leadership_level": "Leading Self", "role_profile": "Assertive Outreach Workers engage individuals experiencing homelessness who may not actively seek support. They use assertive outreach approaches to identify needs and risks, provide immediate support and referrals, coordinate access to services and housing pathways, and support individuals to transition to ongoing supports."}, {"role_id": "RL014", "framework_role": "Intensive Case Manager", "role_category": "Case Management", "band": "4", "leadership_level": "Leading Self", "role_profile": "Intensive Case Managers provide flexible, intensive and persistent case management support to individuals with complex and intersecting needs. They conduct comprehensive assessments, coordinate multi-disciplinary responses, maintain engagement through periods of instability or crisis, and work collaboratively with stakeholders to support long-term housing and wellbeing outcomes."}, {"role_id": "RL015", "framework_role": "Community Wellbeing Worker", "role_category": "Support Services", "band": "4", "leadership_level": "Leading Self", "role_profile": "Community Wellbeing Workers promote health, wellbeing and community participation through engagement, wellbeing programs and community-based activities. They support access to essential resources and services, facilitate activities and initiatives, and work collaboratively with community partners to strengthen wellbeing outcomes and social connection."}, {"role_id": "RL016", "framework_role": "Youth Development Worker", "role_category": "Support Services", "band": "4", "leadership_level": "Leading Self", "role_profile": "Youth Development Workers provide strengths-based, youth-centred support to young people experiencing or at risk of homelessness. They support participation, independence and goal progression through engagement, coordinated supports, learning activities and community participation, while working collaboratively with partner organisations and external stakeholders to strengthen opportunities and pathways for young people."}, {"role_id": "RL017", "framework_role": "Young Adult Support Worker", "role_category": "Case Management", "band": "4", "leadership_level": "Leading Self", "role_profile": "Young Adult Support Workers provide strengths-based and trauma-informed support to young adults experiencing or at risk of homelessness. They develop and coordinate personalised support plans, maintain engagement through flexible approaches, advocate for access to services and opportunities, and support individuals to achieve their goals, independence and wellbeing outcomes."}, {"role_id": "RL018", "framework_role": "Education Pathways Program Facilitator", "role_category": "Specialist Practice", "band": "5", "leadership_level": "Leading Self", "role_profile": "Education Pathways Program Facilitators support children and families experiencing homelessness to improve educational engagement and outcomes. They provide education-focused case management, coordinate supports with schools and service providers, build caregiver and staff capability, and deliver training, consultation and advocacy to strengthen educational participation and inclusion."}, {"role_id": "RL019", "framework_role": "By Name List Worker", "role_category": "Systems Coordination", "band": "5", "leadership_level": "Leading Self", "role_profile": "By Name List Workers support coordinated service responses for individuals experiencing homelessness through data coordination, stakeholder collaboration and systems-focused practice. They maintain and analyse shared data sets, facilitate collaboration between partner agencies, monitor system movement and acuity, and contribute to service and system improvement initiatives."}, {"role_id": "RL020", "framework_role": "Relationship Officer", "role_category": "Specialist Practice", "band": "5", "leadership_level": "Leading Self", "role_profile": "Relationship Officers develop and coordinate programs and partnerships that strengthen engagement, participation and program outcomes. They build and sustain stakeholder relationships, support volunteer mentor programs, monitor and evaluate program performance, and contribute to program design, implementation and continuous improvement initiatives."}, {"role_id": "RL021", "framework_role": "Senior Worker", "role_category": "Practice Leadership", "band": "5", "leadership_level": "Leading Others", "role_profile": "Senior Workers provide advanced practice leadership and support across service delivery teams. They guide complex assessments, risk management and case coordination, provide secondary consultation and mentoring to staff, strengthen practice consistency and quality, and contribute to service improvement and coordinated responses across programs and stakeholders."}, {"role_id": "RL022", "framework_role": "Team Leader", "role_category": "Operational Leadership", "band": "5", "leadership_level": "Leading Others", "role_profile": "Team Leaders provide operational leadership and day-to-day oversight of service delivery teams. They support staff practice, manage service quality and risk, facilitate coordinated responses, build team capability through supervision and coaching, and foster safe, inclusive and high-performing team environments aligned with organisational standards and values."}, {"role_id": "RL023", "framework_role": "Coordinator", "role_category": "Operational Leadership", "band": "6", "leadership_level": "Leading Others", "role_profile": "Coordinators provide operational leadership and oversight of programs, services and teams to ensure safe, effective and high-quality service delivery. They lead workforce planning, staff capability development, service coordination, operational and budget oversight, stakeholder collaboration and continuous improvement initiatives aligned with organisational priorities and service requirements."}, {"role_id": "RL024", "framework_role": "Project Coordinator", "role_category": "Operational Leadership", "band": "6", "leadership_level": "Leading Others", "role_profile": "Project Coordinators provide operational leadership and coordination across projects, partnerships and service initiatives to support consistent, high-quality and integrated service delivery. They lead collaboration across stakeholders, support implementation of system improvements, monitor outcomes and contribute to continuous improvement, reporting and service development activities."}, {"role_id": "RL025", "framework_role": "Service Manager", "role_category": "Operational Leadership", "band": "6", "leadership_level": "Leading Leaders", "role_profile": "Service Managers provide strategic and operational leadership across multiple programs, services or operational functions to ensure safe, effective and high-quality service delivery. They lead service performance, workforce capability, partnerships, continuous improvement and change initiatives while driving innovation, accountability and improved client and organisational outcomes."}];
var ALIASES       = {"After-Hours Support Worker": "After Hours Support Worker", "Housing Transitions Worker": "Housing Transition Worker", "IAP Worker": "IAP Woker", "Resident Engagement Officer": "Residential Engagement Officer"};

// ── STATE — single source of truth ───────────────────────────────────────────
var state = {
  selectedRole:  "",   // "" = show landing, anything else = show detail
  bandFilter: ""
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function getProfile(roleName){
  var t = ALIASES[roleName] || roleName;
  return ROLE_PROFILES.find(function(p){ return p.framework_role === t; }) || null;
}
function llClass(ll){
  if(ll === "Leading Self")    return "tag-ll-self";
  if(ll === "Leading Others")  return "tag-ll-others";
  return "tag-ll-leaders";
}

// ── DERIVED ───────────────────────────────────────────────────────────────────
var ALL_ROLES = (function(){
  var seen = {}, out = [];
  MOCK_DATA.forEach(function(r){
    if(!seen[r.role]){ seen[r.role] = true; out.push(r.role); }
  });
  return out.sort();
})();

// ── RENDER ────────────────────────────────────────────────────────────────────
// Single render() rewrites #app entirely. No display toggling, no state mismatch.
function render(){
  var app = document.getElementById("app");
  if(!app) return;
  app.innerHTML = state.selectedRole ? renderDetail() : renderLanding();
}

// ── LANDING ───────────────────────────────────────────────────────────────────
function renderLanding(){
  var b = state.bandFilter;
  var filtered = ALL_ROLES.filter(function(r){
    var band = (MOCK_DATA.find(function(x){ return x.role===r; })||{}).band||"";
    return !b || band.indexOf(b)>=0;
  });

  var cards = filtered.length
    ? filtered.map(function(roleName){
        var p    = getProfile(roleName);
        var band = (MOCK_DATA.find(function(r){ return r.role===roleName; })||{}).band||"";
        var cat  = p ? p.role_category    : "";
        var ll   = p ? p.leadership_level : "";
        var inds = MOCK_DATA.filter(function(r){ return r.role===roleName; }).length;
        var fams = (function(){
          var s=new Set(); MOCK_DATA.filter(function(r){return r.role===roleName;}).forEach(function(r){s.add(r.skill_family);}); return s.size;
        })();
        return '<div class="role-card" data-role="'+esc(roleName)+'">'
          +'<div class="role-card-name">'+esc(roleName)+'</div>'
          +'<div class="role-card-meta">'
            +(band ? '<span class="tag tag-band">'+esc(band)+'</span>' : '')
            +(cat  ? '<span class="tag tag-cat">'+esc(cat)+'</span>'  : '')
            +(ll   ? '<span class="tag '+llClass(ll)+'">'+esc(ll)+'</span>' : '')
          +'</div>'
          +'<div class="role-card-stat">'+fams+' skill famil'+(fams!==1?'ies':'y')+' &middot; '+inds+' indicator'+(inds!==1?'s':'')+'</div>'
          +'</div>';
      }).join("")
    : '<div class="no-results">No roles match your search.</div>';

  return '<div class="consult-banner">'+'<strong>Framework Review Tool.</strong> Use this tool to browse and review the framework before or during review sessions.'+'<ul>'+'<li>Whether the indicators reflect what roles actually do in practice</li>'+'<li>Whether any capabilities are missing or need refinement</li>'+'<li>How the framework supports development, progression, and consistency</li>'+'</ul></div>'+'<div id="landing-inner" style="padding:24px 32px">'
    +'<div class="landing-title">Framework Roles</div>'
    +'<div class="landing-sub">Select any role to view its profile, capability expectations, and organisational usage.</div>'
    +'<div class="search-row">'
      
      +'<select class="band-filter" id="band-filter" onchange="onBand(this.value)">'
        +'<option value="">All Bands</option>'
        +'<option value="2"'+(state.bandFilter==="2"?" selected":"")+'>Band 2</option>'
        +'<option value="3"'+(state.bandFilter==="3"?" selected":"")+'>Band 3</option>'
        +'<option value="4"'+(state.bandFilter==="4"?" selected":"")+'>Band 4</option>'
        +'<option value="5"'+(state.bandFilter==="5"?" selected":"")+'>Band 5</option>'
        +'<option value="6"'+(state.bandFilter==="6"?" selected":"")+'>Band 6</option>'
        +'<option value="7"'+(state.bandFilter==="7"?" selected":"")+'>Band 7</option>'
      +'</select>'
    +'</div>'
    +'<div class="role-grid" id="role-grid">'+cards+'</div>'
    +'</div>';
}

// ── DETAIL ────────────────────────────────────────────────────────────────────
function renderDetail(){
  var role = state.selectedRole;

  // Back button + prev/next
  var list = (function(){
    var b=state.bandFilter;
    return ALL_ROLES.filter(function(r){
      var band=(MOCK_DATA.find(function(x){return x.role===r;})||{}).band||"";
      return !b||band.indexOf(b)>=0;
    });
  })();
  var idx  = list.indexOf(role);
  var prev = idx > 0           ? list[idx-1] : "";
  var next = idx < list.length-1 ? list[idx+1] : "";

  var nav = '<div class="c-back-bar">'
    +'<button class="c-back-btn" onclick="goBack()">&#9664; Back to Framework Roles</button>'
    +'<div style="display:flex;gap:8px;align-items:center">'
      +(prev ? '<button class="nav-btn" onclick="selectRole(\''+esc(prev)+'\')">&#9664; Prev</button>' : '<button class="nav-btn" disabled>&#9664; Prev</button>')
      +'<span class="c-role-counter">'+(idx>=0?idx+1:'?')+' of '+list.length+'</span>'
      +(next ? '<button class="nav-btn" onclick="selectRole(\''+esc(next)+'\')">Next &#9654;</button>' : '<button class="nav-btn" disabled>Next &#9654;</button>')
    +'</div>'
    +'</div>';

  // Header
  var p    = getProfile(role);
  var band = (MOCK_DATA.find(function(r){ return r.role===role; })||{}).band||"";
  var cat  = p ? p.role_category    : "";
  var ll   = p ? p.leadership_level : "";
  var prof = p ? p.role_profile     : "";

  var header = '<div class="role-header-card">'
    +'<h2>'+esc(role)+'</h2>'
    +'<div class="role-meta-row">'
      +(band ? '<span class="tag tag-band">'+esc(band)+'</span>' : '')
      +(cat  ? '<span class="tag tag-cat" style="background:#EEE5FA;color:#582C83">'+esc(cat)+'</span>' : '')
      +(ll   ? '<span class="tag '+llClass(ll)+'">'+esc(ll)+'</span>' : '')
    +'</div>'
    +(prof
      ? '<div class="role-profile-text">'+esc(prof)+'</div>'
      : '<div class="role-profile-text" style="color:#777;font-style:italic">Role profile not available.</div>')
    +'</div>';

  // Skills — always fully expanded
  var recs = MOCK_DATA.filter(function(r){ return r.role===role; });
  var skillsHtml = "";
  if(!recs.length){
    skillsHtml = '<p style="color:#777;font-style:italic;padding:16px 0">No skills found for this role.</p>';
  } else {
    var grouped = {};
    recs.forEach(function(r){
      if(!grouped[r.skill_family]) grouped[r.skill_family]={};
      if(!grouped[r.skill_family][r.skill]) grouped[r.skill_family][r.skill]=[];
      grouped[r.skill_family][r.skill].push(r.indicator);
    });
    skillsHtml = Object.keys(grouped).map(function(fn){
      var skills = grouped[fn];
      var sns    = Object.keys(skills);
      var total  = sns.reduce(function(n,s){ return n+skills[s].length; }, 0);
      var blocks = sns.map(function(sn){
        var inds = skills[sn].map(function(ind){
          return '<div class="c-indicator">'+esc(ind)+'</div>';
        }).join("");
        return '<div class="c-skill-block">'
          +'<div class="c-skill-name">'+esc(sn)+'</div>'
          +inds
          +'</div>';
      }).join("");
      return '<div class="c-family-block">'
        +'<div class="c-family-header">'
          +'<span class="c-family-title">'+esc(fn)+'</span>'
          +'<span class="c-family-count">'+sns.length+' skill'+(sns.length!==1?'s':'')+' &middot; '+total+' indicator'+(total!==1?'s':'')+'</span>'
        +'</div>'
        +blocks
        +'</div>';
    }).join("");
  }

  var skillsSec = '<div class="section-header">Skills &amp; Capability Indicators</div>'
    +'<div class="section-sub">All capability expectations for this role, grouped by skill family.</div>'
    +skillsHtml;

  // Positions
  var rolePos = POSITION_DATA.filter(function(p){ return p.role===role; });
  var posHtml = "";
  if(!rolePos.length){
    posHtml = '<div class="positions-section">'
      +'<div class="section-header">Positions Using This Role</div>'
      +'<div class="section-sub" style="color:#777;font-style:italic">No organisational positions mapped to this role.</div>'
      +'</div>';
  } else {
    var byTitle = {};
    rolePos.forEach(function(p){
      if(!byTitle[p.position_title]) byTitle[p.position_title]={units:new Set(),portfolio:p.portfolio};
      byTitle[p.position_title].units.add(p.org_unit);
    });
    var rows = Object.entries(byTitle).map(function(e){
      return '<tr><td>'+esc(e[0])+'</td><td>'+[...e[1].units].sort().map(esc).join(", ")+'</td><td>'+esc(e[1].portfolio||"")+'</td></tr>';
    }).join("");
    posHtml = '<div class="positions-section">'
      +'<div class="section-header">Positions Using This Role</div>'
      +'<div class="section-sub">This framework role is used across <strong>'+rolePos.length+'</strong> organisational position'+(rolePos.length!==1?'s':'')+'.</div>'
      +'<div style="overflow-x:auto"><table class="pos-table">'
        +'<thead><tr><th>Position Title</th><th>Organisation Unit</th><th>Portfolio</th></tr></thead>'
        +'<tbody>'+rows+'</tbody>'
      +'</table></div></div>';
  }

  // Related roles
  var relNames = [];
  if(p){
    var myBand=parseInt(p.band)||0, myCat=p.role_category;
    ALL_ROLES.forEach(function(r){
      if(r===role) return;
      var rp=getProfile(r); if(!rp) return;
      if(rp.role_category===myCat || Math.abs((parseInt(rp.band)||0)-myBand)<=1) relNames.push(r);
    });
  }
  var relHtml = relNames.length
    ? '<div class="related-section">'
        +'<div class="section-header">Related Roles</div>'
        +'<div class="section-sub">Roles in the same category or adjacent band.</div>'
        +'<div class="related-chips">'
          +relNames.slice(0,8).map(function(r){
            return '<span class="related-chip" data-role="'+esc(r)+'">'+esc(r)+'</span>';
          }).join("")
        +'</div></div>'
    : "";

  return '<div style="padding:24px 32px">'+nav+header+skillsSec+posHtml+relHtml+'</div>';
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function goBack(){
  state.selectedRole = "";
  render();
  window.scrollTo(0,0);
}
function selectRole(roleName){
  state.selectedRole = roleName;
  render();
  window.scrollTo(0,0);
}
function onBand(val){
  state.bandFilter = val;
  render();
}

// ── DELEGATED CLICKS ──────────────────────────────────────────────────────────
document.getElementById("app").addEventListener("click", function(e){
  // Role card on landing
  var card = e.target.closest(".role-card[data-role]");
  if(card){ selectRole(card.dataset.role); return; }
  // Related chip on detail
  var chip = e.target.closest(".related-chip[data-role]");
  if(chip){ selectRole(chip.dataset.role); return; }
});

// Header title click
document.getElementById("site-title").addEventListener("click", function(){
  goBack();
});

// ── HEADER STATS ─────────────────────────────────────────────────────────────
(function(){
  var el = document.getElementById("header-stats");
  if(!el) return;
  var fam = new Set(MOCK_DATA.map(function(r){return r.skill_family;}));
  var sk  = new Set(MOCK_DATA.map(function(r){return r.skill;}));
  var items = [
    ["Roles", ALL_ROLES.length],
    ["Skill Families", fam.size],
    ["Skills", sk.size],
    ["Indicators", MOCK_DATA.length]
  ];
  el.innerHTML = items.map(function(x){
    return '<div class="hstat"><div class="hstat-num">'+x[1]+'</div><div class="hstat-lbl">'+esc(x[0])+'</div></div>';
  }).join("");
})();

// ── BOOT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
