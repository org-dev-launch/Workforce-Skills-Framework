function drGenerate() {
  var s = SKILL_DEV[DRAWER.skillCode]||DEFAULT_DEV;
  var cats = {experience:s.experience||[],exposure:s.exposure||[],education:s.education||[]};
  var selected = [];
  document.querySelectorAll('#dr-goal-opts input:checked').forEach(function(cb){
    var arr=cats[cb.dataset.cat]||[]; var idx=parseInt(cb.dataset.idx);
    if(arr[idx]) selected.push(arr[idx]);
  });
  var ctx = ((document.getElementById('dr-ctx')||{}).value||"").trim();
  if(ctx) selected.push(ctx);
  if(!selected.length) return;

  var isCurrent = DRAWER.type==="current";
  var verb = (DRAWER.type==="develop")?"build":"strengthen";
  var goal = "";
  if(selected.length===1) {
    var a0=selected[0].charAt(0).toLowerCase()+selected[0].slice(1);
    a0=a0.replace(/\.\s*$/,"");
    if(isCurrent){
      var indLow=DRAWER.indicator.charAt(0).toLowerCase()+DRAWER.indicator.slice(1);
      indLow=indLow.replace(/\.\s*$/,"");
      goal="I will "+a0+" to develop my ability to "+indLow+".";
    } else {
      goal="I will "+a0+" to "+verb+" my capability in "+DRAWER.skillName+".";
    }
  } else {
    if(isCurrent){
      var indLow2=DRAWER.indicator.charAt(0).toLowerCase()+DRAWER.indicator.slice(1);
      indLow2=indLow2.replace(/\.\s*$/,"");
      goal="To develop my ability to "+indLow2+", I will:\n";
    } else {
      goal="To "+verb+" my capability in "+DRAWER.skillName+", I will:\n";
    }
    selected.forEach(function(act){
      var a=act.charAt(0).toLowerCase()+act.slice(1).replace(/\.\s*$/,"");
      goal+="\u2022 "+a+"\n";
    });
    goal=goal.trimEnd()+".";
  }
  goal+="\n\nIndicator: "+DRAWER.indicator;
  if(!isCurrent && DRAWER.tgtRole) goal+="\nTarget role: "+DRAWER.tgtRole;

  var result = document.getElementById('dr-result');
  if(!result) return;
  result.innerHTML =
    '<div class="dr-result-label">Your development goal</div>'
    +'<textarea class="dr-result-ta" id="dr-result-ta" spellcheck="true">'+goal+'</textarea>'
    +'<div class="dr-result-hint">Edit before copying. Paste into Culture Amp or your development plan.</div>'
    +'<div class="dr-result-actions">'
      +'<button class="dr-copy-btn" id="dr-copy-btn" onclick="drCopy()">Copy goal</button>'
      +'<button class="dr-retry-btn" onclick="drawerShowGoal()">Choose different activities</button>'
    +'</div>';
  result.classList.remove('hidden');
  result.scrollIntoView({behavior:'smooth',block:'nearest'});
  var btn=document.getElementById('dr-gen-btn');
  if(btn) btn.style.display='none';
}

function drCopy() {
  var ta=document.getElementById('dr-result-ta'); if(!ta) return;
  navigator.clipboard.writeText(ta.value).catch(function(){ta.select();document.execCommand('copy');});
  var btn=document.getElementById('dr-copy-btn');
  if(btn){btn.textContent='✓ Copied!';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='Copy goal';btn.classList.remove('copied');},2500);}
}

// Close drawer on Escape
document.addEventListener('keydown',function(e){if(e.key==='Escape')drawerClose();});


// ── PORTFOLIO NORMALISATION ───────────────────────────────────────────────────
// Normalises legacy Pando export value to current official name.
// When Pando eventually exports "Homelessness Outcomes" directly,
// the passthrough branch handles it — no further code change required.
function displayPortfolio(raw) {
  if (!raw) return "";
  if (raw.trim() === "Homelessness Solutions & Impact") return "Homelessness Outcomes";
  return raw;
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
render();

// Delegated click handler for drawer action buttons
// Runs after render() so #main exists; re-usable across re-renders
document.getElementById("main").addEventListener("click", function(e) {
  var btn = e.target.closest(".dr-open-dev, .dr-open-goal");
  if (!btn) return;
  var d = btn.dataset;
  if (btn.classList.contains("dr-open-dev")) {
    drawerOpenDev(d.sc, d.ind, d.sn, d.type, d.cur, d.tgt);
  } else {
    drawerOpenGoal(d.sc, d.ind, d.sn, d.type, d.cur, d.tgt);
  }
});
</script>

  <div id="dev-drawer-inner" style="flex:1;display:flex;flex-direction:column"></div>
